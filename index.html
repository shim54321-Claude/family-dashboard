/* ============================================================
   לוח חופשות שנה"ל (טבלת school_calendar) — מקור אחד לשני דברים:
   ימי חופשה שהלוח מדלג עליהם, וימים עם יציאה מוקדמת שדורסים
   את שעת הסיום הנגזרת. טבלה ריקה/חסרה = התנהגות כמו קודם.
     kind: 'vacation' | 'study_day' | 'early_dismissal'
   ============================================================ */
let SCHOOL_CAL=[];

function calRowsCovering(iso){
  return SCHOOL_CAL.filter(r=>{
    const s=String(r.start_date||'').trim();
    const e=String(r.end_date||'').trim()||s;
    return s && iso>=s && iso<=e;
  });
}
function isVacationDate(iso){
  return calRowsCovering(iso).some(r=>r.kind==='vacation');
}
/* 'HH:MM' ליציאה מוקדמת באותו יום, או null */
function earlyDismissalFor(iso){
  const r=calRowsCovering(iso).find(x=>x.kind==='early_dismissal' && x.early_time);
  return r?String(r.early_time).slice(0,5):null;
}
/* תגית ליום שאינו חופשה אבל מצוין (סיגד, יום זיכרון) */
function studyDayNote(iso){
  const r=calRowsCovering(iso).find(x=>x.kind==='study_day');
  return r?(r.event||''):'';
}

/* שעת סיום היום לילד: תחילת השיעור האחרון + אורך שיעור (45 דק׳),
   אלא אם היום מסומן כיציאה מוקדמת — ואז הזמן מהלוח גובר כמו שהוא.
   מחזיר null אם אין ממה לגזור. */
const LESSON_MIN=45;
function endOfDayFor(items,iso){
  const early=earlyDismissalFor(iso);
  if(early) return {time:early, forced:true};
  const lessons=items.filter(x=>x.type==='lesson' && x.t);
  if(!lessons.length) return null;
  const start=hhmmToMin(lessons[lessons.length-1].t);
  if(start===null) return null;
  const end=Math.min(start+LESSON_MIN, 23*60+59);
  const hh=String(Math.floor(end/60)).padStart(2,'0');
  const mm=String(end%60).padStart(2,'0');
  return {time:`${hh}:${mm}`, forced:false};
}

/* ============================================================
   שכבת שליטה ידנית מעל Hebcal (סדר עדיפות מלמעלה למטה):
     1. manual_windows source='force'  — "הצג עכשיו", גובר על הכל
     2. manual_windows source='manual' — אירוע מתוזמן שהוגדר ידנית
     3. zmanim_overrides               — דריסת שעת כניסה/יציאה לתאריך מסוים
     4. Hebcal                         — ברירת המחדל, כמו עד היום
   שלוש הראשונות נטענות מ-Supabase; אם הטבלאות ריקות/חסרות,
   ההתנהגות זהה לחלוטין למה שהיה לפני השינוי.
   ============================================================ */
let ZMANIM_OVERRIDES=[];   // [{date:'YYYY-MM-DD', candle_time:'HH:MM', havdalah_time:'HH:MM'}]
let MANUAL_WINDOWS=[];     // [{name, start_at, end_at, source}]

/* 'HH:MM' על תאריך נתון → Date אמיתי, לפי שעון ישראל ולא לפי שעון המכשיר.
   קריטי: הקיוסק הוא TV stick שעלול לחזור מאיפוס באזור זמן שגוי, ולכן
   דריסה של "18:20" חייבת להיות 18:20 בישראל בכל מקרה. */
/* 'YYYY-MM-DD' של רגע נתון לפי שעון ישראל */
function israelIsoOf(at){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',
    year:'numeric',month:'2-digit',day:'2-digit'}).format(at);
  return p;
}
function israelOffsetMs(at){  const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jerusalem',
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(at);
  const g=t=>+p.find(x=>x.type===t).value;
  const asUTC=Date.UTC(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'),g('second'));
  return asUTC-at.getTime();
}
function atTimeOn(baseDate,hhmm){
  const m=hhmmToMin(hhmm);
  if(m===null) return null;
  /* התאריך נלקח לפי שעון ישראל של baseDate, לא לפי המכשיר */
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jerusalem',
    year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(baseDate);
  const g=t=>+p.find(x=>x.type===t).value;
  const wall=Date.UTC(g('year'),g('month')-1,g('day'),Math.floor(m/60),m%60,0);
  /* היפוך: מנחשים ומתקנים לפי ההיסט בפועל באותו רגע (עמיד למעבר שעון קיץ) */
  let t=new Date(wall-israelOffsetMs(new Date(wall)));
  t=new Date(wall-israelOffsetMs(t));
  return t;
}

/* מחיל דריסות זמנים על החלונות שכבר חושבו מ-Hebcal.
   הדריסה מזוהה לפי התאריך של הדלקת הנרות (כניסה) או של ההבדלה (יציאה),
   כך שאפשר לדרוס רק צד אחד ולהשאיר את השני אוטומטי. */
function applyZmanimOverrides(){
  for(const w of SHABBAT_WINDOWS){
    /* שומרים את הערכים האוטומטיים פעם אחת, וכל הרצה נגזרת מהם מחדש —
       כך שהסרת דריסה בפאנל באמת מחזירה את הזמן האוטומטי. */
    if(!w._auto){
      w._auto={candles:new Date(w.candles),havdala:new Date(w.havdala),end:new Date(w.end)};
    }
    w.candles=new Date(w._auto.candles);
    w.havdala=new Date(w._auto.havdala);
    w.end=new Date(w._auto.end);
    w.manualStart=false; w.manualEnd=false;

    /* התאריך שאליו הדריסה משויכת נקבע לפי שעון ישראל, לא לפי המכשיר */
    const candleIso=israelIsoOf(w.candles), havIso=israelIsoOf(w.havdala);
    const ovStart=ZMANIM_OVERRIDES.find(o=>o.date===candleIso && o.candle_time);
    const ovEnd  =ZMANIM_OVERRIDES.find(o=>o.date===havIso    && o.havdalah_time);
    if(ovStart){
      const t=atTimeOn(w._auto.candles,ovStart.candle_time);
      if(t){ w.candles=t; w.manualStart=true; }
    }
    if(ovEnd){
      const t=atTimeOn(w._auto.havdala,ovEnd.havdalah_time);
      if(t){ w.havdala=t; w.end=new Date(t.getTime()+30*60*1000); w.manualEnd=true; }
    }
  }
}

/* חלון ידני פעיל כרגע — force קודם, אחר כך אירוע מתוזמן.
   תוכן התצוגה תמיד נגזר מחלון שבת/חג אמיתי של Hebcal, לעולם לא משעות
   ההפעלה הידנית עצמן (שהן שרירותיות — "עוד שעתיים" וכו'). הבחירה:
     1. target_date מפורש — החלון שמכיל אותו תאריך (תצוגה מקדימה מכוונת)
     2. אין target_date — החלון האמיתי הקרוב ביותר: זה שפעיל כרגע אם יש,
        אחרת הבא בתור. זה מה ש"הצג מסך שבת/חג עכשיו" תמיד אמור להביא.
   משך ההצגה בפועל (מתי המסך דלוק) עדיין נשלט לגמרי ע"י start_at/end_at.
   רק אם אין שום חלון אמיתי ידוע (Hebcal לא נטען) נופלים לשעות הידניות. */
function nearestRealWindow(now){
  if(!SHABBAT_WINDOWS.length) return null;
  const active=SHABBAT_WINDOWS.find(x=>now>=x.start && now<x.end);
  if(active) return active;
  const upcoming=SHABBAT_WINDOWS.filter(x=>x.start>=now)
    .sort((a,b)=>a.start-b.start);
  if(upcoming.length) return upcoming[0];
  /* אין קדימה — לוקחים את האחרון שהיה, עדיף מלוח ריק */
  return [...SHABBAT_WINDOWS].sort((a,b)=>b.start-a.start)[0]||null;
}
function activeManualWindow(){
  const now=nowDate();
  const inRange=r=>{
    const s=new Date(r.start_at), e=new Date(r.end_at);
    return !isNaN(s) && !isNaN(e) && now>=s && now<e;
  };
  const pick=MANUAL_WINDOWS.filter(inRange);
  if(!pick.length) return null;
  const forced=pick.find(r=>r.source==='force');
  const r=forced||pick[0];
  const s=new Date(r.start_at), e=new Date(r.end_at);

  let rw=null;
  if(r.target_date){
    rw=SHABBAT_WINDOWS.find(x=>windowDates(x).includes(r.target_date))||null;
    if(!rw) console.warn('manual_windows target_date לא נמצא בחלונות Hebcal הידועים:',r.target_date);
  }
  if(!rw) rw=nearestRealWindow(now);

  if(rw){
    return {start:rw.start, end:rw.end, names:rw.names,
            candles:rw.candles, havdala:rw.havdala,
            manual:true, forced:r.source==='force',
            previewDate:r.target_date||null};
  }

  /* מוצא אחרון: אין נתוני Hebcal בכלל */
  return {start:s, end:e, names:r.name?[r.name]:[],
          candles:s, havdala:e, manual:true, forced:r.source==='force'};
}

/* ============================================================
   חלונות שבת/חג — זמנים אמיתיים מ-Hebcal (כניסה/יציאה),
   כולל מיזוג שרשראות רצופות וכלל "שבת מוקדמת" (≥17:00 → 16:00 קבוע)
   מחושב פעם ביום קדימה ~45 יום, ונשמר בזיכרון כדי שהמסך ימשיך
   לעבוד גם בלי אינטרנט בזמן השבת/חג עצמם.
   ============================================================ */
let SHABBAT_WINDOWS=[];      // [{start:Date, end:Date, names:[...]}]
let windowsBuiltForDay=null;

async function buildShabbatWindows(){
  if(!hebcal){ SHABBAT_WINDOWS=[]; return; }
  try{
    const {HebrewCalendar,Location,flags}=hebcal;
    const loc=new Location(CONFIG.LAT,CONFIG.LON,true,CONFIG.TIMEZONE,'Custom','IL');
    const start=nowDate(); start.setDate(start.getDate()-3);
    const end=nowDate(); end.setDate(end.getDate()+45);
    const events=HebrewCalendar.calendar({start,end,location:loc,il:true,candlelighting:true});

    // שלב 1: זוגות התחלה/סוף לפי סוג האירוע ולא לפי דגלים.
    // חשוב: בשבת רגילה ההבדלה נושאת את הדגל LIGHT_CANDLES_TZEIS (שנראה כמו "התחלה"),
    // ורק בחג היא נושאת YOM_TOV_ENDS. לכן הסתמכות על דגלים משאירה את חלון
    // השבת פתוח עד החג הבא. getDesc() חד-משמעי: Candle lighting / Havdalah.
    const raw=[];
    let openStart=null;
    for(const ev of events){
      const t=ev.eventTime;
      if(!t) continue;
      const desc=ev.getDesc();
      if(desc==='Candle lighting'){
        if(openStart===null) openStart=t;
      }else if(desc==='Havdalah'){
        if(openStart!==null){ raw.push({start:openStart,end:t}); openStart=null; }
      }
    }

    // שלב 2: שמות חג אמיתיים — רק אירועי-יום עם דגל CHAG (לא הדלקת נרות/הבדלה,
    // ולא ראש חודש — לראש חודש אין דגל CHAG, נשאר רק כתגית נפרדת)
    const chagEvents=events
      .filter(ev=>!ev.eventTime && flags.CHAG && (ev.getFlags() & flags.CHAG))
      .map(ev=>({date:ev.getDate().greg(), name:hebNameGematria(stripNikud(ev.render('he')||''))}));

    // מיזוג שרשראות רצופות (פער קטן מ-שעה = המשך)
    raw.sort((a,b)=>a.start-b.start);
    const merged=[];
    for(const w of raw){
      const last=merged[merged.length-1];
      if(last && (w.start-last.end)<60*60*1000){ last.end=w.end; }
      else{ merged.push({start:w.start,end:w.end}); }
    }

    // חלון תצוגה בפועל: שעה לפני הדלקת נרות, אלא אם ≥17:00 → 16:00 קבוע.
    // מסתיים 30 דק' אחרי סוף השרשרת (לא נוגעים בזה — נשאר כמו שהיה).
    SHABBAT_WINDOWS=merged.map(w=>{
      // כניסה קבועה ב-12:00 ביום של הדלקת הנרות (ערב שבת/חג)
      const winStart=new Date(w.start);
      winStart.setHours(CONFIG.SHABBAT_START_HOUR,0,0,0);
      const candles=new Date(w.start);   // זמן הדלקת נרות אמיתי
      const havdala=new Date(w.end);     // זמן צאת השבת/חג אמיתי
      const winEnd=new Date(w.end.getTime()+30*60*1000);
      const names=chagEvents.filter(c=>c.date>=w.start && c.date<w.end)
                             .map(c=>c.name)
                             .filter((n,i,arr)=>n && arr.indexOf(n)===i);
      return {start:winStart,end:winEnd,names,candles,havdala};
    });
  }catch(e){
    console.warn('שגיאה בחישוב חלונות שבת/חג — נופל חזרה למצב ללא Hebcal',e);
    SHABBAT_WINDOWS=[];
  }
}

/* החלון הפעיל כרגע, אם יש — חלון ידני גובר על החישוב האוטומטי */
function activeShabbatWindow(){
  const manual=activeManualWindow();
  if(manual) return manual;
  const now=nowDate();
  return SHABBAT_WINDOWS.find(w=>now>=w.start && now<w.end)||null;
}

/* תגית תצוגה לחלון: "שבת קודש", שמות חג/ים, וראש חודש — כל מה שרלוונטי יחד */
function windowTags(w){
  const tags=[];
  let hasShabbat=false;
  for(let d=new Date(w.start);d<w.end;d.setDate(d.getDate()+1)){
    if(d.getDay()===6) hasShabbat=true;
    if(isRoshChodesh(d) && !tags.includes('ראש חודש')) tags.push('ראש חודש');
  }
  if(hasShabbat) tags.unshift('שבת קודש');
  w.names.forEach(n=>{ if(n && !tags.includes(n)) tags.push(n); });
  return tags.length?tags:['שבת קודש'];
}
function windowDisplay(w){
  const tags=windowTags(w);
  const chagName=w.names[0]||'';
  const greet = chagName ? greetFor(chagName) : 'שבת שלום';
  const icon  = chagName ? iconFor(chagName)  : '🕯️';
  return {greet,icon,label:tags.join(' • ')};
}

/* ============================================================
   לו"ז תפילות + הודעת קהילה — נשלף מ-Supabase לפי החלון הפעיל.
   שלושה סוגי לו"ז נפרדים לחלוטין, בלי ירושה ביניהם:
   regular_shabbat / holiday / shabbat_holiday
   ============================================================ */

/* סוג הלו"ז של החלון: שבת בלבד / חג בלבד / שבת+חג */
function scheduleTypeFor(w){
  let hasShabbat=false;
  for(let d=new Date(w.start);d<w.end;d.setDate(d.getDate()+1)){
    if(d.getDay()===6){ hasShabbat=true; break; }
  }
  const hasChag=(w.names&&w.names.length>0);
  if(hasShabbat&&hasChag) return 'shabbat_holiday';
  if(hasChag) return 'holiday';
  return 'regular_shabbat';
}

/* התאריכים שהחלון נוגע בהם — הלו"ז מתויג לאחד מהם */
function windowDates(w){
  const out=[];
  const d=new Date(w.start); d.setHours(0,0,0,0);
  const last=new Date(w.end);
  while(d<=last){ out.push(isoDate(d)); d.setDate(d.getDate()+1); }
  return out;
}

/* פרשת השבוע — מחושב מ-Hebcal, לא נשמר בבסיס הנתונים */
function parashaFor(w){
  if(!hebcal) return '';
  try{
    const {HebrewCalendar,Location}=hebcal;
    const loc=new Location(CONFIG.LAT,CONFIG.LON,true,CONFIG.TIMEZONE,'Custom','IL');
    const start=new Date(w.start); start.setHours(0,0,0,0);
    const end=new Date(w.end); end.setDate(end.getDate()+1);
    const evs=HebrewCalendar.calendar({start,end,location:loc,il:true,sedrot:true,noHolidays:true});
    for(const ev of evs){
      const t=stripNikud(ev.render('he')||'');
      if(t.includes('פרשת')) return t;
    }
  }catch(e){ console.warn('parasha unavailable',e); }
  return '';
}

const PRAYER_CACHE_KEY='prayerCache';

/* שמירה מקומית — כדי שהמסך ימשיך לעבוד בשבת גם בלי אינטרנט */
function cachePrayers(key,payload){
  try{ localStorage.setItem(PRAYER_CACHE_KEY,JSON.stringify({key,payload})); }catch(e){}
}
function readPrayerCache(key){
  try{
    const raw=localStorage.getItem(PRAYER_CACHE_KEY);
    if(!raw) return null;
    const o=JSON.parse(raw);
    return (o&&o.key===key)?o.payload:null;
  }catch(e){ return null; }
}

const hhmm=t=>String(t||'').slice(0,5);

/* ---- זמני כניסה/יציאה — חלון קטן ועדין מעל לוח התפילות ---- */
const TIME_FMT=new Intl.DateTimeFormat('he-IL',
  {timeZone:CONFIG.TIMEZONE,hour:'2-digit',minute:'2-digit',hour12:false});
function renderZmanim(w){
  const box=$('zmanim');
  if(!w||!w.candles||!w.havdala){ box.classList.add('hidden'); return; }
  const isChag=(w.names||[]).length>0;
  let hasShabbat=false;
  for(const iso of windowDates(w)){
    if(new Date(iso+'T12:00:00').getDay()===6){ hasShabbat=true; break; }
  }
  $('zlbl0').textContent='הדלקת נרות';
  $('zlbl1').textContent = (isChag&&!hasShabbat) ? 'צאת החג'
                         : (isChag? 'צאת השבת והחג' : 'צאת השבת');
  $('zval0').textContent=TIME_FMT.format(w.candles);
  $('zval1').textContent=TIME_FMT.format(w.havdala);
  box.classList.remove('hidden');
}

/* ---- כותרת יום בתוך בלוק שבת/חג ---- */
const DAY_FULL_LIST=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function dayHeading(iso, w){
  const d=new Date(iso+'T12:00:00');
  const dow=d.getDay();
  const chagNames=(w.names||[]);
  // האם יום זה עצמו הוא יום חג (כל יום בחלון מלבד ערב החג הראשון)
  const dates=windowDates(w);
  const isFirst=(iso===dates[0]);
  const isSat=(dow===6);
  // ערב: היום הראשון בחלון כשהוא אינו שבת בעצמו
  if(isFirst && !isSat){
    return chagNames.length ? 'ערב חג' : 'ערב שבת';
  }
  const parts=[];
  if(isSat) parts.push('שבת קודש');
  if(chagNames.length){
    // מתאימים שם חג לפי סדר ימי החג בתוך החלון (ללא הערב הראשון)
    const chagDays=dates.filter((x,i)=>!(i===0 && new Date(x+'T12:00:00').getDay()!==6));
    const idx=chagDays.indexOf(iso);
    const nm=chagNames[idx>=0?Math.min(idx,chagNames.length-1):0];
    if(nm && !parts.includes(nm)) parts.push(nm);
  }
  if(!parts.length) parts.push('יום '+DAY_FULL_LIST[dow]);
  return parts.join(' · ');
}

/* ---- הפריט הקרוב: הראשון שזמנו עוד לא עבר ---- */
function nextPrayerId(rows){
  const now=israelNow();
  let best=null,bestT=Infinity;
  for(const r of rows){
    const t=new Date(r.date+'T'+String(r.time||'00:00:00').slice(0,8)).getTime();
    if(isNaN(t)) continue;
    if(t>=now.getTime() && t<bestT){ bestT=t; best=r; }
  }
  return best?best.id:null;
}

/* מועד שורת תפילה — בדיוק אותו חישוב כמו nextPrayerId, כדי ש"עבר" ו"הבא"
   לעולם לא יסתרו זה את זה. שעון קיר ישראלי, לא שעון המכשיר. */
function prayerInstant(r){
  if(!r||!r.date||!r.time) return null;
  const t=new Date(r.date+'T'+String(r.time||'00:00:00').slice(0,8)).getTime();
  return isNaN(t)?null:t;
}

/* ---- ציור: מקובץ לפי יום, עמודה ליום, הדגשה לפריט הקרוב ---- */
/* מציג לוח תפילות מקובץ לפי יום; notesByDate={iso:[טקסטים]} — הודעת קהילה
   ליום הספציפי הזה (לא הודעה גלובלית אחת למסך כולו, כדי שכמה ימים עם
   הודעות שונות באותו חלון יוצגו כולם, כל אחד תחת היום הנכון שלו) */
function renderPrayerRows(box,rows,w,notesByDate){
  notesByDate=notesByDate||{};
  const sorted=[...rows].sort((a,b)=>
    String(a.date).localeCompare(String(b.date)) ||
    (a.display_order||0)-(b.display_order||0));

  const byDay=new Map();
  for(const r of sorted){
    if(!byDay.has(r.date)) byDay.set(r.date,[]);
    byDay.get(r.date).push(r);
  }
  // ימים שיש להם רק הודעת קהילה בלי אף שורת תפילה — עדיין מקבלים עמודה
  for(const iso of Object.keys(notesByDate)){
    if(!byDay.has(iso)) byDay.set(iso,[]);
  }
  const entries=[...byDay.entries()].sort((a,b)=>a[0].localeCompare(b[0]));

  const nextId=nextPrayerId(sorted);

  // מספר העמודות נגזר ממספר הימים בפועל, כדי שחג ארוך לא יישבר
  box.dataset.cols=String(Math.min(entries.length,4));
  box.innerHTML='';

  const nowT=israelNow().getTime();
  // מעמעמים שורות שעברו רק כל עוד יש עוד משהו לפנינו. אחרי הפריט האחרון
  // אין "הבא", וללא התנאי הזה כל הלוח היה נצבע חיוור ונראה שבור.
  const dimPast=(nextId!==null);

  for(const [iso,list] of entries){
    const col=document.createElement('div');
    col.className='pday';

    if(entries.length===1){
      const head=document.createElement('div');
      head.className='ptitle';
      head.textContent='זמני תפילות';
      col.appendChild(head);
    }else{
      const head=document.createElement('div');
      head.className='pdayhead';
      const h=document.createElement('div');
      h.className='pdh'; h.textContent=dayHeading(iso,w);
      head.appendChild(h);
      col.appendChild(head);
    }

    for(const r of list){
      const row=document.createElement('div');
      const isNext=(nextId!==null&&r.id===nextId);
      // שורה שכבר עברה מעומעמת — בשבת אחה"צ חצי הלוח כבר לא רלוונטי
      const t=prayerInstant(r);
      const isPast=(dimPast && !isNext && t!==null && t<nowT);
      row.className='prow'+(isNext?' pnext':'')+(isPast?' ppast':'');

      const tm=document.createElement('span');
      tm.className='ptime'; tm.textContent=hhmm(r.time);

      const nm=document.createElement('span');
      nm.className='pname'; nm.textContent=r.title||'';
      if(r.location){
        const lc=document.createElement('span');
        lc.className='ploc'; lc.textContent=r.location;
        nm.appendChild(lc);
      }

      row.appendChild(tm); row.appendChild(nm);
      col.appendChild(row);
    }

    const noteTexts=notesByDate[iso];
    if(noteTexts&&noteTexts.length){
      const nd=document.createElement('div');
      nd.className='pdaynote';
      nd.textContent=noteTexts.join(' · ');
      col.appendChild(nd);
    }

    box.appendChild(col);
  }
}

/* שליפה + הצגה. לא ממציא לו"ז: אם אין נתונים לתאריך — לא מוצג כלום.
   הודעות קהילה מוצגות לפי היום שלהן (community_notes.date), לא כהודעה
   גלובלית אחת — כך שכמה אירועים בימים שונים (או אפילו באותו יום) בתוך
   אותו חלון שבת/חג מוצגים כולם, כל אחד תחת היום הנכון שלו. */
async function renderPrayers(w){
  const box=$('prayers');
  const type=scheduleTypeFor(w);
  const dates=windowDates(w);
  const key=type+'|'+dates.join(',');

  let rows=null, notes=null;
  if(db){
    try{
      const [pRes,nRes]=await Promise.all([
        db.from('prayer_schedule').select('*')
          .eq('schedule_type',type).in('date',dates).order('display_order'),
        db.from('community_notes').select('*').in('date',dates),
      ]);
      if(!pRes.error) rows=pRes.data||[];
      if(!nRes.error) notes=nRes.data||[];
      if(rows) cachePrayers(key,{rows,notes:notes||[]});
    }catch(e){ console.warn('prayer schedule unavailable',e); }
  }
  if(rows===null){                       // אין רשת — נופלים למטמון
    const cached=readPrayerCache(key);
    if(cached){ rows=cached.rows; notes=cached.notes; }
  }

  const notesByDate={};
  for(const n of (notes||[])){
    if(!n||!n.text||!n.date) continue;
    (notesByDate[n.date]||(notesByDate[n.date]=[])).push(n.text);
  }

  if((rows&&rows.length)||Object.keys(notesByDate).length){
    renderPrayerRows(box,rows||[],w,notesByDate);
    box.classList.remove('hidden');
  }else{
    box.innerHTML=''; box.classList.add('hidden');
  }
}

/* ---- מזג אוויר ---- */
const WCODE={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',
 61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',80:'🌧️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
/* המלצת לבוש — לפי הטמפרטורה המעוגלת שמוצגת על המסך בלבד.
   גשם לא משנה את הבגד; הוא רק מוסיף ☂️ + אחוז (ראו rainSuffix). */
function clothingFor(max){
  const t=Math.round(max);
  if(t>=30) return {icon:'👕🧢',   text:'חם מאוד — קצרים וכובע'};
  if(t>=25) return {icon:'👕',     text:'נעים — קצרים'};
  if(t>=18) return {icon:'🧥',     text:'מומלץ סווטשירט'};
  if(t>=12) return {icon:'🧥🧣',   text:'קריר — מעיל קל'};
  return          {icon:'🧥🧤🧣', text:'קר — מעיל חם'};
}
/* קצר/ארוך ללוח הראשי (13.11.2026) — לפי המקסימום היומי המעוגל בלבד */
function sleeveFor(max){
  return Math.round(max)>=CONFIG.SHORT_FROM
    ? {cls:'short',icon:'👕',text:'קצר'}
    : {cls:'long', icon:'🧥',text:'ארוך'};
}
function rainSuffix(p){
  return (p!==null && p!==undefined && p>=CONFIG.RAIN_ALERT_PCT)
    ? ` · ☂️ ${Math.round(p)}%` : '';
}
/* ---- רצועת התחזית (10.11.2026) — אתמול + היום + 3 ימים ----
   הדגשה נודדת: "היום" עד 17:00, ומ-17:00 "מחר" (כמו הכרטיסים הקודמים). */
const WEATHER_FOCUS_HOUR=17;
const WX_CACHE_KEY='fd_wx_v1';
let WX_RAW=null;            // תשובת open-meteo האחרונה (daily) — גם מהמטמון כשאין רשת
let WX_BY_DATE={};          // תחזית לפי תאריך — מסך שבת משתמש בזה
const ARROW_UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V4M5 11l7-7 7 7"/></svg>';
const ARROW_DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M5 13l7 7 7-7"/></svg>';

function wxDayLabel(iso,rel){
  /* "היום שלישי", "מחר רביעי", "אתמול שני", ושאר הימים בשמם (בקשת שים, 10.11.2026) */
  const d=new Date(iso+'T12:00:00');
  const name=DAY_FULL[DAYS[d.getDay()]];
  if(rel===-1) return 'אתמול '+name;
  if(rel===0) return 'היום '+name;
  if(rel===1) return 'מחר '+name;
  return name;
}
/* "ביום חמישי" / "מחר" / "בשבת" — לשורת הסיכום */
function wxDayPhrase(iso,rel){
  if(rel===1) return 'מחר';
  const name=DAY_FULL[DAYS[new Date(iso+'T12:00:00').getDay()]];
  return name==='שבת'?'בשבת':'ביום '+name;
}
/* ההפרש בין שני ימים לפי המקסימום המעוגל — אותו מספר שמוצג על המסך */
function wxDelta(a,b){ return Math.round(b.max)-Math.round(a.max); }

function wxColumns(){
  if(!WX_RAW||!WX_RAW.time) return null;
  const today=isoDate(israelNow());
  const t=WX_RAW.time.indexOf(today);
  if(t<0) return null;                       // מטמון מיום אחר לגמרי — לא מציגים תחזית שגויה
  const from=Math.max(0,t-1), cols=[];
  for(let i=from;i<WX_RAW.time.length && cols.length<5;i++){
    cols.push({iso:WX_RAW.time[i], rel:i-t, code:WX_RAW.weather_code[i],
      max:WX_RAW.temperature_2m_max[i], min:WX_RAW.temperature_2m_min[i],
      rain:(WX_RAW.precipitation_probability_max||[])[i]??null});
  }
  return cols.length>=2?cols:null;
}

function renderForecast(){
  const box=$('fc');
  const cols=wxColumns();
  if(!cols){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const n=cols.length;
  box.style.setProperty('--fcn',n);
  const todayIdx=cols.findIndex(c=>c.rel===0);
  const focusRel=(israelNow().getHours()<WEATHER_FOCUS_HOUR)?0:1;
  let f=cols.findIndex(c=>c.rel===focusRel); if(f<0) f=todayIdx;

  /* רקע: אתמול מקווקו, היום/מחר המודגש — כרטיס לבן */
  $('fcbg').innerHTML=cols.map((c,i)=>`<div class="${c.rel<0?'past':''}${i===f?' focus':''}"></div>`).join('');

  /* שורת הימים */
  $('fcdays').innerHTML=cols.map((c,i)=>{
    const d=new Date(c.iso+'T12:00:00');
    let badge='';
    if(i===f && f>0){                         // תג השינוי של היום המודגש — בפינת העמודה
      const pv=cols[f-1], dd=wxDelta(pv,c), a=Math.abs(dd);
      const than=pv.rel===-1?'מאתמול':pv.rel===0?'מהיום':'';
      badge = a<=1 ? `<span class="wxchip same fdelta">= <span class="w">כמו ${pv.rel===-1?'אתמול':'היום'}</span></span>`
        : `<span class="wxchip fdelta ${a>=4?'big':(dd>0?'up':'down')}">${dd>0?ARROW_UP:ARROW_DOWN}<span class="n">${a}°</span><span class="w"> ${than}</span></span>`;
    }
    return `<div class="fcday${c.rel<0?' past':''}${i===f?' focus':''}">`+
      `<span class="dl">${wxDayLabel(c.iso,c.rel)}</span>`+
      `<span class="dd">${d.getDate()}/${d.getMonth()+1}</span>`+
      `<span class="ic">${WCODE[c.code]||'🌡️'}</span>${badge}</div>`;
  }).join('');

  /* גרף: שני קווים חלקים, אתמול מקווקו. y באחוזים מגובה האזור */
  const all=cols.flatMap(c=>[c.max,c.min]);
  const hi=Math.max(...all), lo=Math.min(...all), span=Math.max(1,hi-lo);
  const yOf=t=>40+(hi-t)/span*32;           // 40%..72% — מקום למספרים הגדולים של היום המודגש
  const xOf=i=>(i+.5)/n*100;                // אחוז מימין
  const svgX=i=>1000-xOf(i)*10;
  const pathFor=(key,a,b)=>{
    let s=`M${svgX(a).toFixed(1)} ${yOf(cols[a][key]).toFixed(1)}`;
    for(let i=a;i<b;i++){
      const x0=svgX(i),x1=svgX(i+1),y0=yOf(cols[i][key]),y1=yOf(cols[i+1][key]),h=(x0-x1)/2;
      s+=` C${(x0-h).toFixed(1)} ${y0.toFixed(1)} ${(x1+h).toFixed(1)} ${y1.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
    }
    return s;
  };
  const p0=cols[0].rel<0?1:0;               // הקטע מאתמול להיום מקווקו
  let svg='<svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">';
  for(const [key,col] of [['max','var(--wx-hot)'],['min','var(--wx-cold)']]){
    if(p0) svg+=`<path class="dash" d="${pathFor(key,0,1)}" style="stroke:${col}"/>`;
    svg+=`<path d="${pathFor(key,p0,n-1)}" style="stroke:${col}"/>`;
  }
  svg+='</svg>';
  let marks='';
  cols.forEach((c,i)=>{
    const cls=(c.rel<0?' past':'')+(i===f?' big':'');
    const x=xOf(i).toFixed(2);
    marks+=`<div class="fcpt${cls}" style="right:${x}%;top:${yOf(c.max).toFixed(2)}%;background:var(--wx-hot)"></div>`;
    marks+=`<div class="fcpt${cls}" style="right:${x}%;top:${yOf(c.min).toFixed(2)}%;background:var(--wx-cold)"></div>`;
    marks+=`<div class="fclbl hi${cls}" style="right:${x}%;top:${yOf(c.max).toFixed(2)}%;color:var(--wx-hot)">${Math.round(c.max)}°</div>`;
    marks+=`<div class="fclbl lo${cls}" style="right:${x}%;top:${yOf(c.min).toFixed(2)}%;color:var(--wx-cold)">${Math.round(c.min)}°</div>`;
  });
  $('fcchart').innerHTML=svg+marks;

  /* תגיות שינוי: כל יום מול היום שלפניו */
  $('fcdelta').innerHTML=cols.map((c,i)=>{
    if(i===0) return `<span class="fcbase">נקודת השוואה</span>`;
    const d=wxDelta(cols[i-1],c), a=Math.abs(d);
    if(a<=1) return `<span class="wxchip same">= <span class="w">כמו ${cols[i-1].rel===-1?'אתמול':cols[i-1].rel===0?'היום':cols[i-1].rel===1?'מחר':DAY_FULL[DAYS[new Date(cols[i-1].iso+'T12:00:00').getDay()]]}</span></span>`;
    const up=d>0, big=a>=4;
    return `<span class="wxchip ${big?'big':(up?'up':'down')}">${up?ARROW_UP:ARROW_DOWN}<span class="n">${a}°</span>`+
      (big?`<span class="w">${up?' חם!':' קר!'}</span>`:(i===1&&c.rel===0?'<span class="w"> מאתמול</span>':''))+`</span>`;
  }).join('');

  /* בגדים + מטרייה לכל יום מהיום והלאה (אותם כללים כמו בכרטיסים הקודמים) */
  $('fcwear').innerHTML=cols.map((c,i)=>{
    if(c.rel<0) return '<span class="fcbase wbase">נקודת השוואה</span>';
    const w=sleeveFor(c.max);
    const rain=(c.rain!==null && c.rain>=CONFIG.RAIN_ALERT_PCT)?`<b class="wr">☂️ ${Math.round(c.rain)}%</b>`:'';
    const sev=SEVERE.includes(c.code);
    return `<span class="wear sl ${w.cls}${i===f?' big':''}${sev?' severe':''}"><span class="wi">${sev?'⚠️':''}${w.icon}</span>`+
      `<span class="wt">${w.text}</span>${rain?(`<span class="wsep"> · </span>`+rain):''}</span>`;
  }).join('');

  /* משפט הסיכום — בשפה של ילדים */
  const fc=cols[f], prev=cols[f-1];
  const who=fc.rel===0?'היום':'מחר', than=fc.rel===0?'מאתמול':'מהיום';
  let s1='', chip='';
  if(prev){
    const d=wxDelta(prev,fc), a=Math.abs(d);
    if(a<=1) s1=`${who} בערך כמו ${fc.rel===0?'אתמול':'היום'}`;
    else{
      s1=`${who} ${d>0?'חם':'קריר'} יותר ${than}`;
      chip=`<span class="wxchip ${a>=4?'big':(d>0?'up':'down')}">${d>0?ARROW_UP:ARROW_DOWN}<span class="n">${a}°</span></span>`;
    }
  }else s1=`${who} ${Math.round(fc.max)}°`;
  let s2='';
  for(let j=f+1;j<n;j++){
    const d=wxDelta(cols[j-1],cols[j]);
    if(Math.abs(d)>=4){ s2=`· ${wxDayPhrase(cols[j].iso,cols[j].rel)} ${d>0?'מתחמם':'מתקרר'} ל־${Math.round(cols[j].max)}°`; break; }
  }
  const fw=sleeveFor(fc.max);
  const fr=(fc.rain!==null && fc.rain>=CONFIG.RAIN_ALERT_PCT)?` · ☂️ ${Math.round(fc.rain)}%`:'';
  $('fcsum').innerHTML=`<span class="s1">${s1}</span>${chip}${s2?`<span class="s2">${s2}</span>`:''}`+
    `<span class="s3">${fw.icon} ${fw.text}${fr}</span>`;
}

async function loadWeather(){
  let daily=null;
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LAT}&longitude=${CONFIG.LON}`
      +`&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
      +`&timezone=${encodeURIComponent(CONFIG.TIMEZONE)}&past_days=1&forecast_days=4`;
    const j=await (await fetch(url)).json();
    if(j&&j.daily&&j.daily.time){ daily=j.daily; try{ localStorage.setItem(WX_CACHE_KEY,JSON.stringify(daily)); }catch(e){} }
  }catch(e){ console.warn('weather failed'); }
  if(!daily){ try{ daily=JSON.parse(localStorage.getItem(WX_CACHE_KEY)||'null'); }catch(e){} }
  if(!daily) return;
  WX_RAW=daily;
  const rainArr=daily.precipitation_probability_max||[];
  WX_BY_DATE={};
  for(let i=0;i<(daily.time||[]).length;i++){
    WX_BY_DATE[daily.time[i]]={code:daily.weather_code[i],
      max:daily.temperature_2m_max[i],min:daily.temperature_2m_min[i],
      rain:(rainArr[i]==null?null:rainArr[i])};
  }
  renderForecast();
  if(document.body.classList.contains('shabbat')) renderShabbatWeather(LAST_WIN);
}

/* ---- מזג אוויר על מסך שבת: שורה אחת, יום אחד לכל יום בחלון ---- */
const SEVERE=[65,75,82,95,96,99];
let LAST_WIN=null;

function renderShabbatWeather(w){
  const box=$('sbwx');
  if(!box) return;
  const dates=w?windowDates(w):[];
  const parts=[];
  for(const iso of dates.slice(0,3)){
    const wx=WX_BY_DATE[iso];
    if(!wx) continue;
    const label=shortDayLabel(iso,w);
    const warn=SEVERE.includes(wx.code)?' wxwarn':'';
    parts.push(`<span class="wxi${warn}"><span class="wxe">${WCODE[wx.code]||'🌡️'}</span>`
      +`<span class="wxd">${label}</span>`
      +`<span class="wxt">${Math.round(wx.max)}°</span></span>`);
  }
  if(!parts.length){ box.innerHTML=''; box.classList.add('hidden'); return; }
  box.innerHTML=parts.join('<span class="wxsep">·</span>');
  box.classList.remove('hidden');
}

/* תווית קצרה ליום בתוך רצועת מזג האוויר — "היום" כשזה באמת היום */
function shortDayLabel(iso,w){
  const today=israelNow();
  const todayIso=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`
    +`-${String(today.getDate()).padStart(2,'0')}`;
  if(iso===todayIso) return 'היום';
  const d=new Date(iso+'T12:00:00');
  return d.getDay()===6 ? 'שבת' : 'יום '+DAY_FULL_LIST[d.getDay()];
}

/* ---- מערכת שעות — כרטיס לכל ילד ---- */
const SPORT_RE=/(חינוך\s*גופני|חנ["׳״”’']?ג|ספורט|התעמלות|שחי[יה]ה)/;

function buildSchedule(periods,rows,overrides,meals,isToday,targetIso){
  const wrap=$('kidcards'); wrap.innerHTML='';
  overrides = overrides || [];
  meals = meals || {};
  const allOv = overrides.find(o=>!o.kid);
  const kidOv = {}; overrides.forEach(o=>{ if(o.kid) kidOv[o.kid]=o; });

  // חופש לכולם — הודעה אחת במקום שלושת הכרטיסים
  if(allOv){
    wrap.innerHTML=`<div class="dayoff">${allOv.note||'חופש'}</div>`;
    return;
  }

  const map={}; KIDS.forEach(k=>map[k.name]={});
  rows.forEach(r=>{ if(map[r.kid]) map[r.kid][r.period]=r.subject; });

  // כל השורות (שיעורים+הפסקות) לפי סדר, בלי תאי "סיים"
  const allOrdered=[...periods].sort((a,b)=>a.order_index-b.order_index);

  const nowMin=(()=>{ const n=israelNow(); return n.getHours()*60+n.getMinutes(); })();
  // "עכשיו" מסומן רק אם היום המוצג הוא באמת היום — לא רק לפי השעה
  const showingToday = !!isToday;

  KIDS.forEach(k=>{
    const ov=kidOv[k.name];
    const hasSport=rows.some(r=>r.kid===k.name && r.subject && SPORT_RE.test(r.subject));

    let inner='';
    let endInfo=null;
    if(ov){
      inner=`<div class="dayoff small">${ov.note||'חופש'}</div>`;
    }else{
      // בונים רשימת פריטים (שיעור/הפסקה) לפי הסדר האמיתי, כולל הפסקות בין שיעורים שקיימים בפועל
      let items=allOrdered.map(p=>{
        if(p.label.trim()==='הפסקה'){
          return {type:'break', t:p.start_time?p.start_time.slice(0,5):''};
        }
        const num=parseInt(p.label,10);
        const subj=map[k.name][num];
        if(subj && subj.trim()) return {type:'lesson', t:p.start_time?p.start_time.slice(0,5):'', subj, num};
        return null;
      }).filter(Boolean);
      // הפסקה לא תיפתח/תיסגר את הכרטיס, ולא תופיע כפולה
      while(items.length && items[0].type==='break') items.shift();
      while(items.length && items[items.length-1].type==='break') items.pop();
      items=items.filter((it,i)=> !(it.type==='break' && items[i-1] && items[i-1].type==='break'));

      // "עכשיו"/"עבר" מחושבים רק על פריטי שיעור
      let nowIdx=-1;
      if(showingToday){
        items.forEach((x,i)=>{
          if(x.type!=='lesson' || !x.t) return;
          const [hh,mm]=x.t.split(':').map(Number);
          if(hh*60+mm<=nowMin) nowIdx=i;
        });
      }
      const firstLessonIdx=items.findIndex(x=>x.type==='lesson');

      inner=items.map((x,i)=>{
        if(x.type==='break') return `<div class="brk-a"><span>הפסקה · ${x.t}</span></div>`;
        let cls='lesson';
        let tag='';
        if(showingToday){
          if(i===nowIdx) cls+=' now';
          else if(i<nowIdx) cls+=' past';
        }else if(i===firstLessonIdx){ cls+=' first'; tag='<span class="ltag">מתחילים</span>'; }
        const shoe=(x.subj && SPORT_RE.test(x.subj))?'<span class="lem">👟</span>':'';
        return `<div class="${cls}"><span class="ltime">${x.t}</span>`+
               `<span class="lsubj">${x.subj}</span>${shoe}${tag}</div>`;
      }).join('');
      endInfo=endOfDayFor(items, targetIso||'');
      if(!inner) inner='<div class="nosched">אין מערכת מעודכנת</div>';
    }

    const m=(k.show_food!==false)?meals[k.name]:null;
    const mealHtml = m
      ? `<div class="mealchip"><span class="ml">ארוחת עשר</span><span class="mv">${m.text}`+
        (m.note?`<span class="fx">${m.note}</span>`:'')+`</span></div>`
      : '';

    /* שעת סיום — נגזרת מהשיעור האחרון, או מיציאה מוקדמת בלוח החופשות */
    const endHtml = endInfo
      ? `<div class="endchip${endInfo.forced?' early':''}">`+
        `<span class="el">${endInfo.forced?'סיום מוקדם':'סיום'}</span>`+
        `<span class="ev">${endInfo.time}</span></div>`
      : '';

    const pts=kidPoints(k);
    wrap.insertAdjacentHTML('beforeend',
      `<div class="kidcard${pts.reached?' reached':''}" style="--c:${k.color};--cbg:${k.bg}">
         <div class="kidhead">
           <span class="kidname">${k.name}</span>
           ${k.grade?`<span class="kidgrade">${k.grade}</span>`:''}
           ${hasSport?'<span class="kidem">👟</span>':''}
           ${pts.tag}
           ${endHtml}
         </div>
         <div class="lessons">${inner}</div>
         ${mealHtml}
         ${pts.html}
       </div>`);
  });
}

let ALL_KIDS=[];
/* אוכל ליום המוצג: רשומה לתאריך גוברת על תבנית שבועית קבועה */
function mealsForDay(all,date,dayLetter){
  const iso=isoDate(date), out={};
  const approved=all.filter(m=>m.status!=='pending'&&m.status!=='rejected');
  const label=m=>(m.food_types&&m.food_types.name)||m.custom_text||'';

  approved.filter(m=>m.is_recurring&&m.weekday===dayLetter)
    .forEach(m=>{ const t=label(m); if(t) out[m.kid]={text:t,note:m.note}; });
  approved.filter(m=>m.date===iso)
    .forEach(m=>{ const t=label(m); if(t) out[m.kid]={text:t,note:m.note}; });
  return out;
}

function buildChugim(list){
  const box=$('chugim'),out=$('chlist');
  if(!list.length){box.classList.add('hidden');return;}
  // היום הנוכחי כאן נמדד מחצות עד חצות — בשונה מכלל ה-12:00
  const nowDay=DAYS[israelNow().getDay()];
  const WEEK=['א','ב','ג','ד','ה','ו'];

  const head='<tr>'+WEEK.map(d=>
    `<th class="${d===nowDay?'chnow':''}"><span>${DAY_FULL[d]}</span></th>`).join('')+'</tr>';

  const body='<tr>'+WEEK.map(d=>{
    const items=list.filter(c=>c.day===d)
      .sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    if(!items.length) return `<td class="${d===nowDay?'chnow':''}"><span class="chempty">—</span></td>`;
    const inner=items.map(c=>{
      const k=ALL_KIDS.find(x=>x.name===c.kid);
      const col=k?k.color:'var(--ink-soft)';
      return `<div class="chent">
        ${c.time?`<span class="t">${c.time.slice(0,5)}</span>`:''}
        <span class="k" style="--c:${col}">${c.kid}</span>
        <span class="a"> ${c.activity}</span>
        ${c.location?`<span class="loc">· ${c.location}</span>`:''}
      </div>`;
    }).join('');
    return `<td class="${d===nowDay?'chnow':''}">${inner}</td>`;
  }).join('')+'</tr>';

  out.innerHTML=head+body;
  box.classList.remove('hidden');
}

const PTS_CACHE_KEY='fd_pts_v1';
let PTS={show:false, goals:[], events:[], settings:{}, kids:[]};

/* התקדמות ליעד: נקודות שנצברו מאז שהיעד התחיל + עודף שהועבר אליו.
   reachedAt = רגע הנקודה שחצתה את היעד (לחגיגה). */
function goalProgress(g){
  const start=new Date(g.started_at).getTime();
  /* צנצנת משפחתית: כל נקודה שניתנה נשארת בה — גם של ילד שהוצא אחר כך מהנקודות (10.11.2026) */
  const evs=PTS.events.filter(e=>!e.undone_at && (g.kid_id==null || e.kid_id===g.kid_id) && new Date(e.created_at).getTime()>=start)
                      .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  let sum=g.carry_in||0, reachedAt=sum>=g.target?start:null;
  for(const e of evs){ sum+=e.points; if(reachedAt===null && sum>=g.target) reachedAt=new Date(e.created_at).getTime(); }
  return {sum, reachedAt, reached:sum>=g.target};
}
function goalOf(kidId){ return PTS.goals.find(g=>g.status==='active' && (kidId==null ? g.kid_id==null : g.kid_id===kidId)); }

async function loadPoints(settingsRows){
  const get=k=>{ const r=(settingsRows||[]).find(x=>x.key===k); return r?String(r.value??'').trim():''; };
  PTS.settings={show:get('points_show_kiosk')!=='0', mode:get('points_celebration')||'once',
                secs:parseInt(get('points_celebration_seconds'),10)||60};
  PTS.show=PTS.settings.show;
  PTS.kids=ALL_KIDS;
  if(!db) return;
  try{
    const g=await db.from('point_goals').select('*').eq('status','active');
    if(g.error) throw g.error;
    const goals=g.data||[];
    const since=goals.length?goals.map(x=>x.started_at).sort()[0]:new Date(nowMs()).toISOString();
    const e=await db.from('point_events').select('id,kid_id,points,created_at,undone_at').gte('created_at',since);
    if(e.error) throw e.error;
    PTS.goals=goals; PTS.events=e.data||[];
    try{ localStorage.setItem(PTS_CACHE_KEY,JSON.stringify({goals:PTS.goals,events:PTS.events})); }catch(_){}
  }catch(err){
    try{ const c=JSON.parse(localStorage.getItem(PTS_CACHE_KEY)||'null'); if(c){ PTS.goals=c.goals||[]; PTS.events=c.events||[]; } }catch(_){}
  }
}

/* שורת "★ 28 / 40" + פס, או כוכבים לילד קטן */
function pointsLine(k,g,p){
  const togo=g.target-p.sum;
  const prize=esc(g.prize||'');
  const label = g.needs_setup ? 'יעד חדש בקרוב'
    : p.reached ? `${prize} מחכה לך!`
    : `עוד ${togo} ל${prize}`;
  const extra = p.reached && p.sum>g.target ? ` <span style="color:var(--c)"><bdi>+${p.sum-g.target}</bdi> לבא</span>` : '';
  if(k.points_display==='stars' && g.target<=20){
    let st=''; for(let i=0;i<g.target;i++) st+=starSvg(i<Math.min(p.sum,g.target));
    return `<div class="kpt"><span class="togo">${label}</span></div><div class="stars">${st}</div>`;
  }
  const pct=g.needs_setup?0:Math.min(100,Math.round(p.sum/g.target*100));
  return `<div class="kpt"><span>★ <b>${p.sum}</b> / ${g.needs_setup?'—':g.target}${extra}</span><span class="togo">${label}</span></div>`+
         `<div class="kbar"><span style="width:${pct}%"></span></div>`;
}
/* מה buildSchedule מוסיף לכרטיס של ילד */
function kidPoints(k){
  if(!PTS.show || k.points_enabled===false) return {html:'',reached:false,tag:''};
  const g=goalOf(k.id); if(!g) return {html:'',reached:false,tag:''};
  const p=goalProgress(g);
  const reached=p.reached && !g.needs_setup;
  return {html:`<div class="kpts">${pointsLine(k,g,p)}</div>`, reached,
          tag:reached?`<span class="goaltag">${MEDAL_SVG}הגעתי ליעד!</span>`:''};
}

function ptKidHtml(k){
  const g=goalOf(k.id), p=goalProgress(g);
  const stars=k.points_display==='stars' && g.target<=20;
  let body='';
  if(stars){ for(let i=0;i<g.target;i++) body+=starSvg(i<Math.min(p.sum,g.target)); body=`<div class="stars">${body}</div>`; }
  else body=`<div class="kbar"><span style="width:${Math.min(100,Math.round(p.sum/g.target*100))}%"></span></div>`;
  const msg=g.needs_setup?'יעד חדש בקרוב':p.reached?`${esc(g.prize)} מחכה לך!`:`עוד ${g.target-p.sum} ל${esc(g.prize)}`;
  return `<div class="ptkid" style="--c:${k.color}"><div class="pkh"><span class="xn">${esc(k.name)}</span>`+
    `<span class="xv">${Math.min(p.sum,g.target)}/${g.target}${stars?' ★':''}</span></div>${body}`+
    `<div class="xs${p.reached?' done':''}">${msg}</div></div>`;
}
/* הצנצנת המשפחתית + ילדים שאין להם כרטיס על הלוח (למשל שהם) */
function renderPointsCard(cardKidNames){
  const box=$('ptcard');
  if(!PTS.show){ box.classList.add('hidden'); $('ptstrip').classList.add('hidden'); return; }

    html+=`<div class="pth">הצנצנת המשפחתית</div>
      <svg class="jar" viewBox="0 0 104 128" role="img" aria-label="${p.sum} מתוך ${fam.target}">
        <defs><clipPath id="jarclip"><path d="M24 18h56v8c10 6 14 14 14 26v58a14 14 0 0 1-14 14H24a14 14 0 0 1-14-14V52c0-12 4-20 14-26z"/></clipPath></defs>
        <rect x="30" y="4" width="44" height="12" rx="4" fill="#C9D3CE"/>
        <path d="M24 18h56v8c10 6 14 14 14 26v58a14 14 0 0 1-14 14H24a14 14 0 0 1-14-14V52c0-12 4-20 14-26z" fill="#F4F6F5"/>
        <rect x="0" y="${fillTop}" width="104" height="128" fill="#E2A13B" clip-path="url(#jarclip)"/>
        <path d="M24 18h56v8c10 6 14 14 14 26v58a14 14 0 0 1-14 14H24a14 14 0 0 1-14-14V52c0-12 4-20 14-26z" fill="none" stroke="#9AA8A2" stroke-width="3"/>
      </svg>
      <div class="ptn">${Math.min(p.sum,fam.target)} / ${fam.target}</div>
      ${p.reached&&!fam.needs_setup?`<div class="ptdone">הגענו ליעד! ${esc(fam.prize)}</div>`:`<div class="ptp">${esc(fam.prize)}</div>`}`;
  }
  /* ילדים בלי כרטיס על הלוח: בדרך כלל רק שהם → בתוך כרטיס הצנצנת.
     כשאין כרטיסים בכלל (חופש / הודעה על כל המסך) → רצועה נפרדת וגדולה לכולם. */
  const others=PTS.kids.filter(k=>k.points_enabled!==false && !cardKidNames.includes(k.name) && goalOf(k.id));

  box.innerHTML=html;

/* חגיגה: מסך מלא (ברירת מחדל: פעם אחת) כשיעד מושג. נזכר במכשיר שכבר הוצג.
   בלי אחסון במכשיר לא מציגים מסך מלא בכלל (התג בכרטיס עדיין מופיע) — כדי
   שלא יקפוץ שוב בכל רענון. בשבת/חג לא מוצג; מוצג במוצאי שבת. */
let celebrateTimer=null;
function storageOk(){ try{ localStorage.setItem('fd_t','1'); localStorage.removeItem('fd_t'); return true; }catch(e){ return false; } }
function maybeCelebrate(inShabbat){
  const box=$('celebrate');
  if(!PTS.show || inShabbat || PTS.settings.mode==='tag' || !storageOk() || !box.classList.contains('hidden')) return;
  const now=nowMs(), iso=isoDate(israelNow());
  for(const g of PTS.goals){
    if(g.status!=='active' || g.needs_setup) continue;
    const kid=g.kid_id==null?null:PTS.kids.find(k=>k.id===g.kid_id);
    if(g.kid_id!=null && (!kid || kid.points_enabled===false)) continue;
    const p=goalProgress(g);
    if(!p.reached || now-p.reachedAt>96*3600*1000) continue;
    const onceKey='fd_cele_'+g.id;
    let key=null;
    if(!localStorage.getItem(onceKey)) key=onceKey;
    else if(PTS.settings.mode==='daily' && israelNow().getHours()>=7 && !localStorage.getItem(onceKey+'_'+iso)) key=onceKey+'_'+iso;
    if(!key) continue;
    localStorage.setItem(key,'1'); localStorage.setItem(onceKey,'1');
    const color=kid?kid.color:'#E2A13B';
    const title=kid?`כל הכבוד ${esc(kid.name)}!`:'כל הכבוד משפחה!';
    box.innerHTML=`<div class="cbox" style="--c:${color}">${TROPHY_SVG}
      <div class="cbig">${title}</div>
      <div class="cnum">${Math.min(p.sum,g.target)} / ${g.target}</div>
      <div class="cprize"><span>${kid?'הגעת ליעד! הפרס:':'הגענו ליעד המשפחתי! הפרס:'}</span>${PRIZE_ICONS[g.prize_icon]||''}<b>${esc(g.prize)}</b></div>
      <div class="csub">מחכה למימוש — אבא או אמא יסמנו "מומש"</div></div>`;
    box.classList.remove('hidden');
    clearTimeout(celebrateTimer);
    celebrateTimer=setTimeout(()=>box.classList.add('hidden'),Math.max(5,PTS.settings.secs)*1000);
    box.onclick=()=>box.classList.add('hidden');
    return;   // אחת בכל פעם — הבאה ברענון הבא
  }
}

/* ============================================================
   התאמה אוטומטית למסך — מבטיח שכלום לא נחתך
   ============================================================ */
/* ---- טקסט הכיסוי: הופך טקסט חופשי לכותרת + רשימה כשצריך ----
   הכלל שההורים מקלידים לפיו:
     שורה ראשונה שנגמרת בנקודתיים  ->  כותרת
     כל שורה אחריה                 ->  פריט ברשימה
   שורה אחת, או טקסט בלי נקודתיים  ->  הודעה גדולה רגילה, כמו קודם.
   תבליט שהוקלד ידנית בתחילת שורה מוסר כדי שלא יופיע פעמיים. */
function parseCoverNote(raw){
  const text=String(raw==null?'':raw).replace(/\r/g,'').trim();
  if(!text) return {kind:'empty'};
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);
  if(lines.length>1 && /:$/.test(lines[0])){
    const items=lines.slice(1).map(s=>s.replace(/^[-\u2013\u2022*]\s*/,'')).filter(Boolean);
    if(items.length) return {kind:'list',title:lines[0],items:items};
  }
  return {kind:'text',text:lines.join('\n')};
}

function renderCoverNote(el,raw){
  const p=parseCoverNote(raw);
  el.textContent='';
  el.classList.remove('long');
  if(p.kind==='empty') return;
  if(p.kind==='text'){
    const d=document.createElement('div');
    d.className='covermsg'; d.textContent=p.text;
    el.appendChild(d);
    return;
  }
  const h=document.createElement('div');
  h.className='covertitle'; h.textContent=p.title;
  el.appendChild(h);
  const ul=document.createElement('ul');
  ul.className='coverlist';
  p.items.forEach(function(t){
    const li=document.createElement('li');
    li.textContent=t;
    ul.appendChild(li);
  });
  el.appendChild(ul);
  if(p.items.length>6) el.classList.add('long');
}

function fitToScreen(){
  if(window.innerWidth <= window.innerHeight) return;   // בטלפון מותרת גלילה

  const root=document.documentElement, app=$('app');

  // בדיקה: האם משהו חורג — בגובה, ברוחב, או תא שנחתך
  const overflows=()=>{
    if(app.scrollHeight > window.innerHeight+1) return true;
    if(app.scrollWidth  > window.innerWidth +1) return true;
    for(const el of app.querySelectorAll('td,th,.note,.chent,.wtip,.shirtcap,.shirtreason,.lsubj,.ltime,.mealchip .mv,.kidname,.schedtitle .sysday,.schednote,.covertitle,.covermsg,.coverlist li,.wear,.wxchip,.kpts .kpt,.ptcard .ptp,.goaltag,.ptkid .xs,.ptkid .xn')){
      if(el.scrollHeight > el.clientHeight+2) return true;   // טקסט נחתך לגובה
      if(el.scrollWidth  > el.clientWidth +2) return true;   // טקסט נחתך לרוחב
    }
    return false;
  };

  // חיפוש בינארי על מקדם קנה המידה — מדויק ומהיר
  let lo=0.30, hi=1.80, best=lo;
  for(let i=0;i<18;i++){
    const mid=(lo+hi)/2;
    root.style.setProperty('--k',mid.toFixed(4));
    app.offsetHeight;                    // מאלץ חישוב מחדש
    if(overflows()){ hi=mid; } else { best=mid; lo=mid; }
  }
  root.style.setProperty('--k',best.toFixed(4));
}

/* חיווי דיסקרטי: מתי נמשכו הנתונים לאחרונה */
function stampSync(){
  const el=$('lastsync'); if(!el) return;
  el.textContent='עודכן '+CLOCK_FMT.format(nowDate());
}

function scheduleFit(){
  requestAnimationFrame(()=>requestAnimationFrame(fitToScreen));
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitToScreen);
  setTimeout(fitToScreen,400);
  setTimeout(fitToScreen,1500);
}

let db=null;
async function init(){
  /* קודם כל — שעה אמינה. בלי רשת ועם שעון שאיבד את עצמו המסך מוקפא */
  if(!(await syncClock())) evaluateClockTrust();
  await loadHebcal();
  await buildShabbatWindows();
  windowsBuiltForDay=israelNow().toDateString();
  try{
    const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
    /* הלוח הציבורי לא משתמש בהתחברות שמורה. אחרת הוא יורש את הכרטיס של לוח הבקרה
       (אותו דומיין, אותו אחסון), ואם הכרטיס פג Supabase דוחה גם קריאות פתוחות (401). */
    db=createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY,
      {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  }catch(e){ showErr('לא ניתן להתחבר למסד הנתונים'); console.error(e); }
  await loadWeather();
  await render();
  stampSync();
  setInterval(async()=>{
    // חלונות השבת/חג נטענים מחדש רק כשמתחלף היום
    const wasFrozen=clockIsFrozen();
    if(!(await syncClock())) evaluateClockTrust();
    const today=israelNow().toDateString();
    if(wasFrozen!==clockIsFrozen() || windowsBuiltForDay!==today){ await buildShabbatWindows(); windowsBuiltForDay=today; }
    await loadWeather(); await render(); stampSync();
  },CONFIG.REFRESH_MIN*60*1000);
  tickClock(); applyNightMode(); applyShirtPulse();
  setInterval(()=>{ tickClock(); applyNightMode(); applyShirtPulse(); },10000);
  window.addEventListener('resize',fitToScreen);
}

/* טעינת שלוש טבלאות השליטה לפני שמחליטים אם המסך במצב שבת/חג.
   חייבות להיטען לפני activeShabbatWindow(), אחרת טריגר ידני לא ייכנס
   לתוקף עד הרענון הבא. אופציונליות לחלוטין: טבלה חסרה/ריקה = התנהגות
   זהה לזו שהייתה לפני התוספת. */
async function loadControlTables(){
  if(!db) return;
  try{
    const [zmOv,manWin,schoolCal]=await Promise.all([
      db.from('zmanim_overrides').select('*'),
      db.from('manual_windows').select('*'),
      db.from('school_calendar').select('*'),
    ]);
    /* שגיאה בטעינה לא מוחקת את מה שכבר נטען */
    if(zmOv&&!zmOv.error) ZMANIM_OVERRIDES=zmOv.data||[];
    if(manWin&&!manWin.error) MANUAL_WINDOWS=manWin.data||[];
    if(schoolCal&&!schoolCal.error) SCHOOL_CAL=schoolCal.data||[];
    applyZmanimOverrides();
  }catch(e){ console.warn('control tables unavailable',e); }
}

    $('schedwrap').style.display='';
  }

  if(db){
    try{
      let [kidsRes,periods,sched,chug,shirts,rules,overrides,mealsRes,settings]=await Promise.all([
        db.from('kids').select('*').order('order_index'),

        db.from('chugim').select('*'),
        db.from('white_shirt').select('*'),
        db.from('white_shirt_rules').select('*'),
        db.from('schedule_overrides').select('*'),
        db.from('meals').select('*, food_types(name)'),
        db.from('settings').select('*'),
      ]);

      /* בקשה שנדחתה (401 וכד') לא זורקת חריגה — היא מחזירה error ו-data ריק,
         ולכן הלוח היה מתרוקן בשקט. כאן מזהים את זה ועוברים לנתונים האחרונים שנשמרו. */
      const RAW=['kids','periods','sched','chug','shirts','rules','overrides','meals','settings'];
      const resList=[kidsRes,periods,sched,chug,shirts,rules,overrides,mealsRes,settings];
      const failed=resList.some(r=>!r||r.error);
      if(failed){
        const lg=loadLastGood();
        if(lg&&lg.data){
          const d=lg.data;
          [kidsRes,periods,sched,chug,shirts,rules,overrides,mealsRes,settings]=RAW.map(k=>({data:d[k]||[]}));

      applyNightSettings(settings.data||[]);

      const note=(settings.data||[]).find(s=>s.key==='parent_note');

        $('shirtbox').classList.remove('on');

        $('fullcover').classList.add('hidden');
      }

      if(!hol && !covering){
        // היום המוצג נקבע כאן, אחרי שיש נתונים: יום הלימודים הבא, לא סתם מחר
        const target=nextSchoolDate(date, sched.data||[],
          (overrides.data||[]).filter(o=>(o.scope||'schedule')==='schedule'));
        const targetLetter=DAYS[target.getDay()];

        $('schedtitle').innerHTML=`<span class="sublabel">${scheduleLabel(target,isTomorrow)}</span>`+
          `<span class="sysdash">—</span><span class="sysday">יום ${DAY_FULL[targetLetter]}</span>`;
        const note2=skippedDaysNote(target);
        $('schednote').textContent=note2;
        $('schednote').classList.toggle('hidden', !note2);
        const isToday = isoDate(target)===isoDate(israelNow());
        buildSchedule(periods.data||[],(sched.data||[]).filter(r=>r.day===targetLetter),
                      (overrides.data||[]).filter(o=>o.date===isoDate(target)
                        && (o.scope||'schedule')==='schedule'),
                      mealsForDay(mealsRes.data||[],target,targetLetter), isToday,
                      isoDate(target));
        buildChugim((chug.data||[]).filter(c=>chugimKids.includes(c.kid)));

        const reason=whiteShirtReason(target, shirts.data||[], rules.data||[]);
        if(reason){
          $('shirtbox').classList.add('on');
          $('shirtreason').textContent=reason;
        }else{
          $('shirtbox').classList.remove('on');
        }
      }
      /* כרטיסי ילדים מוצגים רק ביום לימודים רגיל; אחרת כל הילדים עוברים לכרטיס הנקודות */
      const cardsShown=!hol && !covering && !document.querySelector('#kidcards .dayoff:not(.small)');
      renderPointsCard(cardsShown?KIDS.map(k=>k.name):[]);
      maybeCelebrate(!!hol);
    }catch(e){ showErr('שגיאה בטעינת הנתונים'); console.error(e); }
  }

  // אחרי שכל התוכן במקום — מתאימים למסך
  scheduleFit();
}

init();

/* רישום כאפליקציה (PWA) */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
