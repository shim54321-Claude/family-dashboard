<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח המשפחה</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBF8F3">
<!-- הלוח מנהל בעצמו מצב יום/לילה. "only light" אוסר על הדפדפן (WebView של ה-TV Stick)
     להחשיך את הדף בעצמו — זה מה שגרם לרקע הסגול-כהה בקיוסק (15.10.2026) -->
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="לוח המשפחה">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
/* ============================================================
   פונטים מאוחסנים מקומית — Rubik (Display) + Assistant (Body)
   הועלו ל-/fonts/ בריפו על-ידי שים (ראה הוראות ההעלאה שנשלחו איתו)
   ============================================================ */
@font-face{font-family:'Rubik';src:url('fonts/rubik-var.woff2') format('woff2-variations');
  font-weight:300 900;font-display:swap}
@font-face{font-family:'Assistant';src:url('fonts/assistant-var.woff2') format('woff2-variations');
  font-weight:200 800;font-display:swap}

/* ============================================================
   קובץ הגדרות מרכזי — "לוח שקט" (סבב עיצוב אוגוסט 2026)
   --k = מקדם קנה מידה. נקבע אוטומטית כדי שהדף תמיד ייכנס במסך.
   כל הגדלים ברם (rem) = יחידת גובה מסך × המקדם.
   ============================================================ */
:root{
  --k:1;
  --bg:#F2F4F2; --bg-warm:#F5F1E6;
  --ink:#16211E; --ink-soft:#606E69; --ink-faint:#5F6D67;
  --line:#E3E8E4; --card:#FFFFFF;

  /* צבעי הילדים מגיעים מטבלת kids בסופאבייס (עמודות color/bg) —
     המשתנים כאן משמשים כברירת מחדל בלבד אם שדה ריק */
  --kid1:#2E6F8E; --kid1-bg:#EAF1F4;   /* איתמר — כחול */
  --kid2:#7A5FA8; --kid2-bg:#F1EEF7;   /* עדי — סגול */
  --kid3:#2E8B72; --kid3-bg:#EAF5F1;   /* ענבר — ירוק */

  --alert:#9C6B1F; --alert-bg:#F6EFE2;
  --break-bg:#EEF1EE;
  --kid-ink:#1C2620;   /* טקסט על משטח בצבע הילד — הפוך במצב לילה */

  --font-display:'Rubik',Arial,Helvetica,sans-serif;
  --font-body:'Assistant',Arial,Helvetica,sans-serif;
}
/* ---- מצב לילה: 22:30–05:45, מוגדר קבוע כרגע (ראו הערה בהוראות) ---- */
body.night{
  --bg:#111A17; --bg-warm:#141E1A;
  --ink:#E8EDEA; --ink-soft:#8DA09A; --ink-faint:#8A9691;
  --line:#28332F; --card:#1A2420;
  --alert:#D8A857; --alert-bg:#2A2214;
  --break-bg:#1C2622;
  /* --kid1/2/3 stay constant — kid color/bg come from Supabase (one value,
     no day/night variant yet), so the per-kid table cells are deliberately
     pinned below rather than following the --ink flip. */
}
body.night{--kid-ink:#E8EDEA}
/* משטחי הילדים מגיעים מסופאבייס בגוון בהיר יחיד. במצב לילה מחליפים אותם
   במשטח כהה שנגזר מאותו צבע ילד, כדי שכל הטקסט מעליהם יישאר קריא. */
body.night .kidcard{background:color-mix(in srgb, var(--c) 16%, #111A17)}
/* צבע ילד כטקסט על רקע כהה — תמיד מבהירים, אחרת הוא יורד מתחת ל-4.5:1 */
body.night .kidname,body.night .chent .k{color:color-mix(in srgb, var(--c) 45%, #FFFFFF)}
body.night .kidcard .mealchip{background:color-mix(in srgb, var(--c) 10%, #0C1512)}
body.night .lesson.now{background:color-mix(in srgb, var(--c) 60%, #FFFFFF)}
body.night .lesson.now .lsubj,body.night .lesson.now .ltime{color:#111A17}
:root{color-scheme:only light}
html{font-size:calc(1vh * var(--k))}
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);-webkit-user-select:none;user-select:none}
body.kiosk *{pointer-events:none!important}
body.kiosk{cursor:none}

#app{min-height:100vh;display:flex;flex-direction:column;padding:1.8rem 2vw;gap:1.2rem}

/* א. תאריך */
.datebar{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:.8rem;border-bottom:2px solid var(--line);flex-shrink:0}
.dayname{font-family:var(--font-display);font-size:4.2rem;font-weight:900;line-height:1.15}
.datecol{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.hebdate{font-family:var(--font-display);font-size:3.8rem;font-weight:700}
.gregdate{font-size:2rem;color:var(--ink-soft);margin-top:.2rem}
.clock{font-size:4.2rem;font-weight:900;font-family:var(--font-display);
  color:var(--ink-soft);direction:ltr;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ב. מזג אוויר + חולצה */
.toprow{display:flex;gap:.9vw;flex-shrink:0;align-items:stretch;justify-content:flex-start}
.weather{display:flex;gap:.8vw;flex:0 0 auto}
.wcard{background:transparent;border:1px solid var(--line);border-radius:1.4rem;
  padding:.8rem 1.1vw;flex:0 1 15vw;min-width:9.5vw;display:flex;flex-direction:column;justify-content:center;gap:.15rem}
.wlabel{font-size:1.4rem;font-weight:700;color:var(--ink-soft)}
.wmain{display:flex;align-items:center;gap:.8vw}
.wicon{font-size:2.4rem;line-height:1}
.wtemp{font-size:2.8rem;font-weight:800;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.wrange{font-size:1.3rem;color:var(--ink-soft)}
.wtip{font-size:1.4rem;font-weight:500;color:var(--alert);margin-top:.1rem}
.wtip.wrain{font-weight:700}

/* חולצה לבנה, מזג אוויר פעיל, ופריט "הבא" בשבת — כולם משתמשים באותה
   שפת הדגשה אחת: גלולת דיו. אין צבע accent שני על הלוח (מלבד --alert,
   ששמור בלעדית לאזהרת מזג אוויר קיצוני ב-.wtip). */
.shirtbox{background:var(--card);border:.4rem solid var(--ink);border-radius:1.4rem;
  padding:1rem 1.8vw;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:.3rem;box-shadow:0 0 0 .25rem var(--bg), 0 .4rem 1.6rem rgba(0,0,0,.14)}
.wcard .wtemp,.wcard .wicon{color:var(--ink-soft)}
.wcard.wnow{background:var(--card);border-color:transparent;box-shadow:0 1px 3px rgba(22,33,30,.06)}
.wcard.wnow .wtemp{color:var(--ink)}
.shirtbox.on{display:flex}
.shirtbox.pulse{animation:shirtPulse 2s ease-in-out infinite}
@keyframes shirtPulse{
  0%,100%{border-color:var(--ink);box-shadow:0 0 0 .25rem var(--bg), 0 .4rem 1.6rem rgba(0,0,0,.14)}
  50%{border-color:color-mix(in srgb, var(--ink) 45%, var(--bg));
      box-shadow:0 0 0 .25rem var(--bg), 0 0 0 .55rem color-mix(in srgb, var(--ink) 10%, transparent), 0 .4rem 1.6rem rgba(0,0,0,.14)}
}
@media (prefers-reduced-motion:reduce){.shirtbox.pulse{animation:none}}
.shirtbox svg{height:9.5rem;width:auto;filter:drop-shadow(0 .15rem .4rem rgba(0,0,0,.18))}
.shirtcap{font-size:2rem;font-weight:900;color:var(--ink);white-space:nowrap;letter-spacing:-.01em}
.shirtreason{font-size:1.6rem;font-weight:700;color:var(--ink-soft);opacity:.85;white-space:nowrap}

/* ג+ד. הערות */
.notes{flex-shrink:0;display:flex;flex-direction:column;gap:.5rem}
.note{font-size:2.1rem;font-weight:500;padding:.7rem 1.2vw;background:var(--card);
  border:1px solid var(--line);border-radius:1.4rem;box-shadow:0 1px 3px rgba(22,33,30,.06)}
.note.hidden{display:none}
.note.bold{background:var(--ink);
  color:var(--bg);font-weight:900;font-size:2.6rem}
.note-shirt{background:var(--card);
  color:var(--ink);font-weight:700}

/* ה. מערכת שעות — כרטיס לכל ילד */
.schedwrap{flex-shrink:0;display:flex;flex-direction:column;gap:.5rem}
.schedhead{display:flex;align-items:baseline;gap:1vw;flex-wrap:wrap}
.schedtitle{display:flex;align-items:baseline;gap:.6vw;line-height:1.2}
.schedtitle .sublabel{font-family:var(--font-body);font-size:1.9rem;font-weight:700;color:var(--ink-soft)}
.schedtitle .sysdash{color:var(--ink-faint);font-size:1.7rem}
.schedtitle .sysday{font-family:var(--font-display);font-size:2.6rem;font-weight:900}
.schednote{font-size:1.6rem;color:var(--ink-soft)}
.schednote.hidden{display:none}
/* הערת "אין חיבור" — מוצגת כשהלוח מציג נתונים אחרונים שנשמרו */
.stalenote{font-size:1.5rem;color:var(--alert);font-weight:700}
.stalenote.hidden{display:none}
@media (max-aspect-ratio:1/1){ .stalenote{font-size:12px} }

.kidcards{display:grid;grid-template-columns:repeat(var(--kidcols,3),1fr);gap:1vw;align-items:stretch}
.kidcard{position:relative;border-radius:1.6rem;padding:1rem 1.6vw .9rem 1.2vw;
  background:var(--cbg);display:flex;flex-direction:column;overflow:hidden}
.kidcard::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;
  width:.45rem;background:var(--c)}
.kidhead{display:flex;align-items:baseline;gap:.6vw;margin-bottom:.4rem}
.kidname{font-family:var(--font-display);font-size:2.6rem;font-weight:900;color:var(--c);line-height:1}
.kidgrade{font-size:1.5rem;font-weight:600;color:var(--ink-soft)}
.kidem{font-size:1.5rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;
  width:2.4rem;height:2.4rem;border-radius:999px;flex:none;
  border:1.5px solid color-mix(in srgb, var(--c) 45%, transparent);
  background:color-mix(in srgb, var(--c) 12%, transparent)}
/* שעת סיום היום — שקטה בפינת הכרטיס, לא מתחרה בשם הילד */
.endchip{margin-inline-start:auto;display:flex;align-items:baseline;gap:.35rem;
  font-size:1.3rem;line-height:1;white-space:nowrap}
.endchip .el{color:var(--ink-soft);font-weight:600}
.endchip .ev{font-family:var(--font-display);font-weight:700;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;direction:ltr}
.endchip.early .el,.endchip.early .ev{color:var(--alert)}
.lessons{display:flex;flex-direction:column;margin-bottom:.8rem}
.lesson{display:flex;align-items:center;gap:.7vw;padding:.55rem 0;
  border-bottom:1px solid color-mix(in srgb, var(--c) 22%, transparent);color:var(--kid-ink)}
.lesson:last-child{border-bottom:0}
.ltime{font-family:var(--font-display);font-size:1.6rem;font-weight:500;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;min-width:4.2rem;direction:ltr;text-align:start}
.lsubj{font-size:2.1rem;font-weight:600}
.lem{font-size:1.6rem;opacity:.55}
.lesson.now{background:var(--ink);border-radius:999px;padding:.55rem 1.1vw;
  margin:.15rem -1.1vw;border-bottom:0}
.lesson.now .lsubj,.lesson.now .ltime{color:var(--bg)}
.lesson.now .lem{opacity:.9}
.lesson.past .lsubj,.lesson.past .ltime{color:var(--ink-soft);font-weight:500}
.lesson.first{border:1px solid color-mix(in srgb, var(--c) 55%, transparent);
  border-radius:999px;padding:.5rem 1.1vw;margin:.15rem -1.1vw}
.ltag{font-size:1.3rem;color:var(--ink-soft);font-weight:600;margin-inline-start:auto}
.brk-a{display:flex;justify-content:center;align-items:center;padding:.35rem 0;
  border-top:1px solid color-mix(in srgb, var(--c) 20%, transparent);
  border-bottom:1px solid color-mix(in srgb, var(--c) 20%, transparent)}
.brk-a span{font-size:1.15rem;font-weight:600;color:var(--ink-faint);
  letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.nosched{font-size:1.7rem;color:var(--ink-faint);padding:.6rem 0}
.mealchip{margin-top:auto;display:flex;align-items:baseline;gap:.7vw;background:var(--card);
  border-radius:1.1rem;padding:.55rem 1vw}
.mealchip .ml{font-size:1.35rem;color:var(--ink-soft);font-weight:700;white-space:nowrap}
.mealchip .mv{font-size:1.8rem;font-weight:600;color:var(--kid-ink)}
.mealchip .fx{display:block;font-size:1.35rem;color:var(--ink-soft);font-weight:500}
/* כיסוי מלא — תופס את מקום מערכת השעות, מתחת להערת ההורים. */
#fullcover{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2vh;min-height:0;padding:2vh 2vw}
#fullcover.hidden{display:none}
#fullcover img{max-width:100%;max-height:62vh;object-fit:contain;
  border-radius:1.6rem;box-shadow:0 .6rem 2rem rgba(0,0,0,.14)}
/* טקסט הכיסוי — שלוש צורות: הודעה חופשית, כותרת+רשימה, או כיתוב לתמונה.
   השורה הראשונה נחשבת כותרת רק אם היא נגמרת בנקודתיים ויש שורות אחריה. */
.covertext{font-family:var(--font-display);color:var(--ink);text-align:center;
  max-width:90%;display:flex;flex-direction:column;align-items:center;gap:1.2rem}
.covertext:empty{display:none}
.covermsg{font-size:3.4rem;font-weight:900;line-height:1.25;white-space:pre-line}
.covertitle{font-size:3.4rem;font-weight:900;line-height:1.2}
.coverlist{list-style:none;margin:0;padding:0;text-align:right;display:inline-block}
.coverlist li{font-size:2.3rem;font-weight:700;line-height:1.7;
  padding-inline-start:1.7rem;position:relative}
.coverlist li::before{content:"\2022";position:absolute;inset-inline-start:0;
  color:var(--ink-soft);font-weight:900}
/* רשימה ארוכה מתכווצת מעט כדי להישאר קריאה בלי להיחתך */
.covertext.long .covertitle{font-size:2.7rem}
.covertext.long .coverlist li{font-size:1.9rem;line-height:1.55}
/* כשיש גם תמונה וגם טקסט — הטקסט משמש ככיתוב ולא מתחרה בתמונה */
#fullcover.withimg .covermsg,#fullcover.withimg .covertitle{font-size:2.4rem}
#fullcover.withimg .coverlist li{font-size:1.8rem}
#fullcover.withimg img{max-height:46vh}
@media (max-width:860px){
  #fullcover img{max-height:44vh}
  .covermsg,.covertitle{font-size:26px}
  .coverlist li{font-size:19px;padding-inline-start:14px}
  .covertext.long .covertitle{font-size:22px}
  .covertext.long .coverlist li{font-size:17px}
  #fullcover.withimg .covermsg,#fullcover.withimg .covertitle{font-size:21px}
  #fullcover.withimg .coverlist li{font-size:16px}
}
.dayoff{font-family:var(--font-display);font-size:3.4rem;font-weight:900;color:var(--ink);
  text-align:center;padding:2rem 0;background:var(--card);border-radius:1.6rem}
.dayoff.small{font-size:2.2rem;padding:1.2rem 0;background:transparent}

/* ו. חוגים */
.chugim{flex-shrink:0;background:var(--card);border:1px solid var(--line);
  border-radius:1.4rem;padding:.8rem 1.2vw;box-shadow:0 1px 3px rgba(22,33,30,.06)}
.chugim.hidden{display:none}
.chtitle{font-size:1.9rem;font-weight:700;margin-bottom:.5rem;color:var(--ink-soft)}
/* לוח חוגים שבועי — עמודה לכל יום */
table.chweek{width:100%;border-collapse:collapse;table-layout:fixed}
table.chweek th{font-size:1.5rem;font-weight:700;color:var(--ink-soft);
  padding:.35rem .3vw;text-align:center;border-bottom:1px solid var(--line)}
table.chweek th span{display:inline-block;padding:.2rem .9vw;border-radius:999px}
table.chweek td{padding:.4rem .3vw;vertical-align:top;text-align:center}
/* קווי הפרדה בין הימים */
table.chweek th+th,table.chweek td+td{border-inline-start:1px solid color-mix(in srgb, var(--line) 60%, transparent)}
/* היום הנוכחי — מחצות עד חצות */
table.chweek th.chnow{background:transparent}
table.chweek th.chnow span{background:var(--ink);color:var(--bg)}
table.chweek td.chnow{background:var(--card);border-radius:0 0 1.1rem 1.1rem}
.chent{font-size:1.65rem;line-height:1.25;margin-bottom:.4rem}
.chent .t{font-weight:900;direction:ltr;display:inline-block;margin-inline-end:.3rem}
.chent .k{font-weight:900;color:var(--c,var(--ink))}
.chent .a{color:var(--ink-soft)}
.chent .loc{color:var(--ink-faint);font-size:.9em;margin-inline-start:.2em}
.chempty{font-size:1.4rem;color:var(--ink-faint)}

.datetext{display:contents}

/* ז. רצועת תחזית — אתמול + היום + 3 ימים (הוחלפה בה התמונה המשפחתית, 10.11.2026)
   עמודות ב-grid; הקווים ב-SVG נמתח (viewBox 1000×100), הנקודות והמספרים
   ב-HTML עם left באחוזים — כך שום עיגול/טקסט לא נמתח בשום רוחב מסך. */
:root{--wx-hot:#B4561C;--wx-cold:#2F5F96;--wx-chip-up:#B4561C;--wx-chip-down:#2F5F96;--wx-chip-big:#9C3D0C}
body.night{--wx-hot:#E59A62;--wx-cold:#8FB4E0}
.fc{flex:1 1 auto;min-width:0;background:color-mix(in srgb,var(--card) 40%,var(--bg));
  border:1px solid var(--line);border-radius:1.6rem;padding:.8rem .9vw;
  display:flex;flex-direction:column;gap:.35rem}
.fc.hidden{display:none}
.fchead{display:flex;justify-content:space-between;align-items:center;gap:1vw;padding:0 .5vw}
.fcsum{display:flex;align-items:center;gap:.7vw;flex-wrap:wrap;min-width:0}
.fcsum .s1{font-family:var(--font-display);font-size:2.2rem;font-weight:800;white-space:nowrap}
.fcsum .s2{font-size:1.8rem;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.fcsum .s3{display:none}
.fcleg{display:flex;gap:1vw;font-size:1.4rem;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.fcleg i{display:inline-block;width:2rem;height:.3rem;border-radius:2px;margin-inline-end:.4rem;vertical-align:middle}
.fcbody{position:relative}
.fcgrid{display:grid;grid-template-columns:repeat(var(--fcn,5),minmax(0,1fr))}
.fcbg{position:absolute;inset:0}
.fcbg>div.past{background:repeating-linear-gradient(135deg,transparent 0 .9rem,color-mix(in srgb,var(--ink) 3%,transparent) .9rem 1.8rem);border-radius:1.2rem}
.fcbg>div.focus{background:var(--card);border-radius:1.2rem;box-shadow:0 1px 4px rgba(22,33,30,.08)}
.fcday{position:relative;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding-top:.5rem}
.fcday.past{opacity:.55}
.fcday .dl{font-family:var(--font-display);font-size:2rem;font-weight:800;line-height:1.15;white-space:nowrap}
.fcday.focus .dl{background:var(--ink);color:var(--bg);padding:0 1vw;border-radius:999px}
.fcday .dd{font-size:1.3rem;color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums}
.fcday .ic{font-size:2.6rem;line-height:1.1}
.fcchart{position:relative;height:13rem}
.fcchart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fcchart path{fill:none;stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.fcchart path.dash{stroke-dasharray:2 9;opacity:.6}
.fcpt{position:absolute;transform:translate(50%,-50%);width:1.3rem;height:1.3rem;border-radius:50%;
  border:.25rem solid var(--card);box-sizing:content-box}
.fcpt.big{width:2rem;height:2rem}
.fcpt.past,.fclbl.past{opacity:.55}
.fclbl{position:absolute;transform:translate(50%,calc(-100% - .7rem));font-family:var(--font-display);font-weight:800;
  font-size:2rem;line-height:1;white-space:nowrap;direction:ltr}
.fclbl.lo{font-size:1.7rem;transform:translate(50%,.8rem)}
.fclbl.big{font-size:4.6rem;font-weight:900}
.fclbl.lo.big{font-size:3.4rem}
.fcrow{position:relative;display:grid;grid-template-columns:repeat(var(--fcn,5),minmax(0,1fr));
  justify-items:center;align-items:center;padding:.25rem 0}
.wxchip{display:inline-flex;align-items:center;gap:.35rem;font-size:1.8rem;font-weight:900;line-height:1.2;
  padding:.25rem 1.1rem;border-radius:999px;white-space:nowrap;color:#FFFFFF}
.wxchip svg{width:2rem;height:2rem}
.wxchip.up{background:var(--wx-chip-up)}
.wxchip.down{background:var(--wx-chip-down)}
.wxchip.big{background:var(--wx-chip-big);font-size:2rem;box-shadow:0 0 0 .35rem color-mix(in srgb,var(--wx-chip-big) 22%,transparent)}
.wxchip.same{background:var(--card);color:var(--ink-soft);border:2px solid var(--line)}
.wxchip .n{direction:ltr;font-variant-numeric:tabular-nums}
.fcbase{font-size:1.3rem;color:var(--ink-soft);font-weight:600;opacity:.75}
.wear{display:inline-flex;align-items:center;gap:.4rem;font-size:1.55rem;font-weight:700;color:var(--alert);
  white-space:nowrap;line-height:1.2;padding:.15rem .7rem;border-radius:999px}
.wear .wi{font-size:1.9rem}
.wear b{font-weight:900}
.wear.severe{background:var(--alert-bg);font-weight:900}

/* ח. נקודות — צנצנת משפחתית בשורה העליונה + פס בכל כרטיס ילד */
.ptcard{flex:0 0 auto;width:15vw;background:var(--card);border-radius:1.6rem;padding:1rem .9vw;
  display:flex;flex-direction:column;align-items:center;gap:.35rem;box-shadow:0 1px 3px rgba(22,33,30,.06)}
.ptcard.hidden{display:none}
.ptcard .pth{font-family:var(--font-display);font-size:1.8rem;font-weight:800;text-align:center}
.ptcard svg.jar{height:11rem;width:auto}
.ptcard .ptn{font-family:var(--font-display);font-size:2.8rem;font-weight:900;direction:ltr;font-variant-numeric:tabular-nums}
.ptcard .ptp{font-size:1.5rem;color:var(--ink-soft);font-weight:700;text-align:center;line-height:1.25}
.ptcard .ptdone{font-size:1.5rem;font-weight:900;color:var(--alert);text-align:center}
.ptextra{width:100%;border-top:1px solid var(--line);margin-top:.4rem;padding-top:.7rem;display:flex;flex-direction:column;gap:.9rem}
/* ילד בתוך כרטיס הצנצנת / ברצועת הנקודות — שם גדול, ערך, פס או כוכבים, ושורת "עוד X" */
.ptkid{display:flex;flex-direction:column;gap:.35rem;width:100%}
.ptkid .pkh{display:flex;justify-content:space-between;align-items:baseline;gap:.6vw}
.ptkid .xn{font-family:var(--font-display);font-size:2.1rem;font-weight:900;color:var(--c);line-height:1.1}
.ptkid .xv{font-family:var(--font-display);font-size:1.8rem;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.ptkid .xs{font-size:1.5rem;color:var(--ink-soft);font-weight:700;line-height:1.25}
.ptkid .xs.done{color:#9C6B1F;font-weight:900}
.ptkid .stars{justify-content:flex-start}
.ptkid .stars svg{width:2.1rem;height:2.1rem}
/* רצועת נקודות — כשאין כרטיסי ילדים (יום חופש / הודעה על כל המסך) */
.ptstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(18vw,1fr));gap:1vw;flex-shrink:0}
.ptstrip.hidden{display:none}
.ptstrip .ptkid{background:var(--card);border-radius:1.6rem;padding:1.2rem 1.4vw;border-top:.5rem solid var(--c);
  box-shadow:0 1px 3px rgba(22,33,30,.06)}
.ptstrip .ptkid .xn{font-size:2.6rem}
.stars{display:flex;flex-wrap:wrap;justify-content:center;gap:.15rem;direction:rtl}
.stars svg{width:1.6rem;height:1.6rem}
.kpts{margin-top:.6rem;display:flex;flex-direction:column;gap:.35rem}
.kpts .kpt{display:flex;justify-content:space-between;align-items:baseline;gap:.6vw;font-size:1.5rem;font-weight:700;color:var(--ink-soft)}
.kpts .kpt b{color:var(--kid-ink);font-variant-numeric:tabular-nums}
.kpts .kpt .togo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbar{height:1.3rem;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,var(--card));overflow:hidden}
.kbar>span{display:block;height:100%;border-radius:999px;background:var(--c)}
.kidcard.reached{box-shadow:0 0 0 .4rem #F3D9A8,0 .6rem 2rem rgba(201,135,31,.25)}
.kidcard.reached .kbar{background:#F6EEDD}
.kidcard.reached .kbar>span{background:repeating-linear-gradient(135deg,#E2A13B 0 1.2rem,#EDB85A 1.2rem 2.4rem)}
.kidcard.reached .kpt .togo{color:#9C6B1F;font-weight:900}
.goaltag{display:inline-flex;align-items:center;gap:.4rem;background:#E2A13B;color:#16211E;border-radius:999px;
  padding:.2rem 1rem .2rem .6rem;font-family:var(--font-display);font-size:1.5rem;font-weight:900;white-space:nowrap}
.goaltag svg{width:2rem;height:2rem}
body.shabbat .ptcard,body.shabbat .kpts,body.shabbat .ptstrip,body.shabbat #gotoPoints{display:none!important}

/* חגיגה — מסך מלא פעם אחת כשילד מגיע ליעד */
#celebrate{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  background:rgba(22,33,30,.55)}
#celebrate.hidden{display:none}
#celebrate .cbox{background:#FFFFFF;color:#16211E;border-radius:3rem;padding:4rem 4.4vw 3.4rem;
  display:flex;flex-direction:column;align-items:center;gap:1.2rem;border-top:1rem solid var(--c);
  box-shadow:0 2rem 6rem rgba(0,0,0,.25);max-width:60vw;text-align:center}
#celebrate .cbig{font-family:var(--font-display);font-size:6rem;font-weight:900;color:var(--c);line-height:1.05}
#celebrate .cnum{font-family:var(--font-display);font-size:2.8rem;font-weight:800;color:#606E69;direction:ltr}
#celebrate .cprize{display:flex;align-items:center;gap:1.2rem;background:color-mix(in srgb,var(--c) 12%,#FFFFFF);
  border-radius:2rem;padding:1.4rem 2.6vw}
#celebrate .cprize span{font-size:2.1rem;color:#606E69;font-weight:700}
#celebrate .cprize b{font-family:var(--font-display);font-size:3.2rem;font-weight:900}
#celebrate .cprize svg{width:4.4rem;height:4.4rem}
#celebrate .csub{font-size:1.7rem;color:#606E69;font-weight:600}

/* פס "אין אינטרנט" — כששעון המכשיר לא אמין, המסך האחרון מוקפא */
#offbar{display:none;align-items:center;justify-content:center;gap:1rem;background:var(--alert-bg);color:var(--alert);
  border:1px solid color-mix(in srgb,var(--alert) 35%,transparent);border-radius:999px;
  min-height:4rem;font-size:1.8rem;font-weight:800;flex-shrink:0;padding:0 2vw;text-align:center}
#offbar.on{display:flex}
#offbar svg{width:2.2rem;height:2.2rem;flex:none}
.lastsync{flex-shrink:0;text-align:center;font-size:1.15rem;color:var(--ink-faint);
  opacity:.65;letter-spacing:.02em;margin-top:.15rem;line-height:1.2}


/* ============================================================
   שבת וחג — סבב עיצוב אוגוסט 2026 ("מרווה")
   כותרת אופקית למעלה, לוח התפילות במרכז, איור שקט בתחתית.
   הגוון נגזר כאן ולא ב-:root — מסך שבת הוא הסביבה היחידה שמשתמשת בו.
   ============================================================ */
body.shabbat{
  --bg:#EEF1EC; --bg-warm:#EEF1EC; --card:#FFFFFF;
  --ink:#18211C; --ink-soft:#66716A; --ink-faint:#949E96;
  --line:#E0E5DF;
  background:var(--bg);
}
body.shabbat.night{
  --bg:#141B18; --bg-warm:#141B18; --card:#1C2420;
  --ink:#E9EDE9; --ink-soft:#93A099; --ink-faint:#6E7A74;
  --line:#293330;
}

/* --- הכותרת: פרשה מתחת לתאריך, זמנים ומזג אוויר בקצה הנגדי ---
   ביום חול .datetext הוא display:contents, כך שהיום והתאריך מתפרסים
   לשני קצות הסרגל. במצב שבת הם נאספים לעמודה אחת בצד ההתחלה,
   כדי לפנות את הקצה הנגדי לזמנים ולמזג האוויר. */
body.shabbat .datetext{display:flex;flex-direction:column;align-items:flex-start;
  gap:.15rem;min-width:0}
body.shabbat .datecol{flex-direction:row;align-items:baseline;gap:.5vw}
body.shabbat .hebdate{font-size:2rem;font-weight:600;color:var(--ink-soft)}
body.shabbat .hebdate::after{content:'·';color:var(--ink-faint);margin-inline-start:.5vw}
body.shabbat .gregdate{font-size:2rem;margin-top:0}
.parasha{display:none;font-size:2.1rem;font-weight:600;color:var(--ink-soft);margin-top:.15rem}
body.shabbat .parasha{display:block}
.sbend{display:none;flex-direction:column;align-items:flex-end;gap:.75rem;flex:0 0 auto}
body.shabbat .sbend{display:flex}
body.shabbat .datebar{border-bottom:0;padding-bottom:0;align-items:flex-start}

.zmanim{display:flex;gap:1.1vw}
.zmanim.hidden{display:none}
.zc{background:var(--card);border-radius:1.4rem;padding:.75rem 1.5vw;text-align:center;
  box-shadow:0 1px 3px rgba(22,33,30,.07)}
.zc .zlbl{font-size:1.4rem;color:var(--ink-soft);font-weight:600}
.zc .zval{font-family:var(--font-display);font-weight:800;font-size:4rem;line-height:1.1;
  direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* מזג אוויר על מסך שבת — שורה אחת, בלי כרטיס ובלי צבע.
   אין המלצות לבוש: הן שייכות ליום לימודים. */
.sbwx{display:flex;align-items:baseline;gap:1.4vw;font-size:1.6rem;color:var(--ink-soft)}
.sbwx.hidden{display:none}
.sbwx .wxi{display:flex;align-items:baseline;gap:.45vw}
.sbwx .wxe{font-size:1.9rem;line-height:1}
.sbwx .wxd{font-weight:600}
.sbwx .wxt{font-family:var(--font-display);font-weight:700;color:var(--ink);
  direction:ltr;font-variant-numeric:tabular-nums}
.sbwx .wxsep{color:var(--ink-faint)}
.sbwx .wxwarn{color:var(--alert);font-weight:700}

/* --- לוח התפילות --- */
#holiday{display:none;flex:1;flex-direction:column;min-height:0}
#holiday.on{display:flex}

.prayers{display:grid;gap:0 4.2vw;flex:0 0 auto;margin-top:1.4rem}
.prayers.hidden{display:none}
.prayers[data-cols="1"]{grid-template-columns:minmax(0,44vw);justify-content:center}
.prayers[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.prayers[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.prayers[data-cols="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
.pday{display:flex;flex-direction:column;min-width:0}
.pdayhead{display:flex;align-items:baseline;justify-content:space-between;gap:1vw;
  margin-bottom:.6rem}
.pdayhead .pdh{font-family:var(--font-display);font-weight:800;font-size:2.6rem;line-height:1.15}
.ptitle{font-family:var(--font-display);font-weight:800;font-size:2.6rem;margin-bottom:.6rem}

.prow{display:flex;align-items:center;gap:1.5vw;padding:.85rem 0;
  border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .ptime{font-family:var(--font-display);font-weight:700;font-size:2.4rem;
  min-width:8.4rem;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prow .pname{font-size:2.3rem;font-weight:600;flex:1;min-width:0}
.prow .ploc{display:block;font-size:1.4rem;color:var(--ink-soft);font-weight:500;
  margin-top:.1em}
/* גלולת דיו אחת = "זה הבא" — אותה שפה בדיוק כמו בלוח היום-יום */
.prow.pnext{background:var(--ink);color:var(--bg);border-radius:999px;
  padding:.85rem 1.8vw;margin:0 -1.8vw;border-bottom:0}
.prow.pnext .ploc{color:var(--bg);opacity:.72}
.prow.ppast{opacity:.4}

/* --- איור קווי + פוטר --- */
.sbart{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:.6rem}
.sbart svg{width:48%;max-height:100%;stroke:var(--ink);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;opacity:.14}
body.shabbat.night .sbart svg{opacity:.2}
.sbfoot{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;
  gap:2vw;font-size:1.6rem;color:var(--ink-soft)}
.sbfoot .greet{font-weight:700;color:var(--ink)}
.cnote{font-size:1.6rem;color:var(--ink-soft);text-align:center;flex:1;min-width:0}
.cnote.hidden{display:none}
.pdaynote{font-size:1.35rem;color:var(--ink-soft);margin-top:.6rem;
  padding-top:.6rem;border-top:1px dashed var(--line);line-height:1.35}

#err{position:fixed;bottom:0;inset-inline:0;background:#8B2020;color:#fff;
  font-size:1.8rem;padding:.8rem 2vw;display:none;z-index:50;text-align:center}
#err.on{display:block}

/* כפתור מעבר לבקרה — מופיע רק בטלפון, לעולם לא על הצג בבית */
#gotoControl{display:none;position:fixed;bottom:16px;inset-inline-end:16px;
  background:var(--ink);color:var(--bg);border:none;border-radius:30px;
  padding:13px 22px;font-size:15px;font-weight:700;font-family:var(--font-body);
  box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:60;cursor:pointer;
  text-decoration:none}
/* עיגול הנקודות — בצד השני מלחצן "היום", אותה שפה (כהה ביום, בהיר בלילה) */
#gotoPoints{display:none;position:fixed;bottom:12px;inset-inline-start:16px;width:54px;height:54px;
  border-radius:50%;background:var(--ink);align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:60;text-decoration:none}
#gotoPoints svg{width:34px;height:34px}
#gotoPoints.hidden{display:none!important}

/* טלפון / מסך צר */
@media (max-aspect-ratio:1/1){
  html{font-size:1vh}
  body{overflow:auto;height:auto}
  body.kiosk{cursor:auto}
  body.kiosk #gotoControl,body.kiosk #gotoPoints,body.kiosk #gotoPoints *,
  body.kiosk #celebrate,body.kiosk #celebrate *{pointer-events:auto!important}
  #app{padding:14px 4vw;gap:12px;min-height:auto;padding-bottom:80px}

  .datebar{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .datetext{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
  .dayname{font-size:26px}
  .hebdate{font-size:22px}
  .gregdate{font-size:14px}

  .toprow{flex-direction:column;gap:10px}
  /* תחזית בטלפון: עמודות צרות — אייקון בגד בלבד; המלצת היום במילים עוברת לשורת הסיכום */
  .fc{padding:10px 8px;border-radius:16px}
  .fchead{flex-direction:column;align-items:flex-start;gap:4px}
  .fcsum .s1{font-size:17px}.fcsum .s2{font-size:13px}
  .fcsum .s3{display:inline;font-size:13px;font-weight:800;color:var(--ink)}
  .fcleg{display:none}
  .fcday .dl{font-size:12px;white-space:normal;text-align:center;line-height:1.15;max-width:100%}.fcday .dd{font-size:10px}.fcday .ic{font-size:20px}
  .fcchart{height:100px}
  .fclbl{font-size:15px}.fclbl.lo{font-size:13px}.fclbl.big{font-size:17px}
  .fcpt{width:9px;height:9px;border-width:2px}.fcpt.big{width:12px;height:12px}
  .wxchip{font-size:12px;padding:2px 6px;gap:1px}.wxchip svg{width:12px;height:12px}
  .wxchip.big{font-size:12px}.wxchip .w{display:none}
  .fcbase{font-size:10px}
  .wear{font-size:11px;padding:0;flex-direction:column;gap:0}.wear .wt{display:none}.wear .wi{font-size:18px}
  .ptcard{width:auto;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px;padding:12px}
  .ptcard svg.jar{height:70px}
  .ptcard .pth{font-size:15px;width:100%}.ptcard .ptn{font-size:22px}.ptcard .ptp{font-size:13px}
  .ptextra{width:100%;margin:0;padding-top:8px}
  .ptkid .xn{font-size:16px}.ptkid .xv{font-size:14px}.ptkid .xs{font-size:12px}.ptkid .stars svg{width:16px;height:16px}
  .ptstrip{grid-template-columns:1fr 1fr;gap:10px}.ptstrip .ptkid{padding:10px 12px;border-radius:14px}.ptstrip .ptkid .xn{font-size:17px}
  .kpts .kpt{font-size:12px}.kbar{height:8px}
  .goaltag{font-size:12px}
  #celebrate .cbox{max-width:90vw;padding:24px 18px}
  #celebrate .cbig{font-size:30px}#celebrate .cnum{font-size:18px}
  #celebrate .cprize b{font-size:22px}#celebrate .cprize span{font-size:14px}
  #offbar{font-size:12px;min-height:30px}
  .kidcards{grid-template-columns:1fr;gap:10px}
  .kidname{font-size:20px}.kidgrade{font-size:12px}
  .lsubj{font-size:16px}.ltime{font-size:13px;min-width:44px}
  .mealchip .mv{font-size:14px}.mealchip .ml{font-size:11px}
  .schedtitle .sysday{font-size:19px}.schedtitle .sublabel{font-size:14px}
  .schednote{font-size:12px}
  .wcard{padding:12px 14px}
  .wlabel{font-size:13px}.wicon{font-size:30px}.wtemp{font-size:28px}
  .wrange{font-size:13px}.wtip{font-size:14px}
  .shirtbox{padding:14px;border-width:4px;box-shadow:0 0 0 3px var(--bg)}
  .shirtbox svg{height:70px}
  .shirtcap{font-size:18px}.shirtreason{font-size:15px}

  .note{font-size:15px;padding:10px 12px}


  .chtitle{font-size:15px}
  table.chtab th{font-size:12px}
  table.chtab td{font-size:14px;padding:7px 3px}

  .lastsync{font-size:9px}

  .parasha{font-size:15px}
  body.shabbat .hebdate{font-size:15px}
  body.shabbat .gregdate{font-size:15px}
  body.shabbat .datebar{flex-direction:column;align-items:flex-start;gap:10px}
  .sbend{align-items:flex-start;gap:8px}
  .zmanim{gap:8px}
  .zc{padding:8px 12px;border-radius:12px}
  .zc .zlbl{font-size:11px}.zc .zval{font-size:24px}
  .sbwx{font-size:13px;gap:12px}.sbwx .wxe{font-size:15px}
  .prayers{gap:0 14px;margin-top:12px}
  .prayers[data-cols="1"],.prayers[data-cols="2"],
  .prayers[data-cols="3"],.prayers[data-cols="4"]{grid-template-columns:1fr}
  /* בעמודה אחת הימים נערמים זה מתחת לזה — צריך אוויר ביניהם */
  .pday+.pday{margin-top:14px}
  .pdayhead .pdh,.ptitle{font-size:17px}
  .prow{padding:8px 0;gap:10px}
  .prow .ptime{font-size:16px;min-width:52px}
  .prow .pname{font-size:16px}.prow .ploc{font-size:12px}
  .prow.pnext{padding:8px 12px;margin:0 -12px}
  .sbart svg{width:70%}
  .sbfoot{font-size:12px}
  .cnote{font-size:12px}
  .pdaynote{font-size:11px;margin-top:6px;padding-top:6px}
  #gotoControl{display:block}
  #gotoPoints{display:flex}
}

/* ---- שורת מזג אוויר קומפקטית + קצר/ארוך בולט (13.11.2026, מוקאפ שאושר) ----
   מסך רחב בלבד: בלי שורת סיכום/מקרא ובלי שורת חיצים לכל יום — התג של
   היום המודגש יושב בפינת העמודה שלו. בטלפון (max-aspect-ratio:1/1) נשאר כמו קודם. */
@media (min-aspect-ratio:1/1){

function readClockStore(){ try{ return JSON.parse(localStorage.getItem(CLOCK_KEY)||'null'); }catch(e){ return null; } }
function writeClockStore(ms){ try{ localStorage.setItem(CLOCK_KEY,JSON.stringify({serverMs:ms})); }catch(e){} }

/* ============================================================
   מצב לילה — ברירת מחדל 22:30–05:45 (Asia/Jerusalem), ניתן
   לשינוי או לכיבוי מפאנל ההורים דרך טבלת settings:
     night_mode_enabled = '1' / '0'   (חסר = כבוי — מ-10.11.2026 ברירת המחדל היא בלי מצב לילה)
     night_start        = 'HH:MM'     (חסר = 22:30)
     night_end          = 'HH:MM'     (חסר = 05:45)
   ============================================================ */
const NIGHT_DEFAULTS = {enabled:false, startMin:22*60+30, endMin:5*60+45};
let NIGHT = {...NIGHT_DEFAULTS};

/* 'HH:MM' -> דקות מחצות. כל קלט לא תקין מחזיר null כדי שנפול לברירת המחדל. */
function hhmmToMin(v){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(v||'').trim());
  if(!m) return null;
  const h=+m[1], mi=+m[2];
  if(h>23||mi>59) return null;
  return h*60+mi;
}
function applyNightSettings(settingsRows){
  const get=k=>{ const r=(settingsRows||[]).find(s=>s.key===k); return r?String(r.value??'').trim():''; };
  const en=get('night_mode_enabled');
  const st=hhmmToMin(get('night_start'));
  const en2=hhmmToMin(get('night_end'));
  NIGHT = {
    enabled: en==='' ? NIGHT_DEFAULTS.enabled : !(en==='0'||en==='false'),
    startMin: st===null ? NIGHT_DEFAULTS.startMin : st,
    endMin:   en2===null ? NIGHT_DEFAULTS.endMin  : en2,
  };
  applyNightMode();
}
function isNightNow(){
  if(!NIGHT.enabled) return false;
  const n=israelNow(), mins=n.getHours()*60+n.getMinutes();
  /* חלון שחוצה חצות (22:30→05:45) מול חלון רגיל באותו יום (13:00→15:00) */
  return NIGHT.startMin > NIGHT.endMin
    ? (mins>=NIGHT.startMin || mins<NIGHT.endMin)
    : (mins>=NIGHT.startMin && mins<NIGHT.endMin);
}
function applyNightMode(){ document.body.classList.toggle('night', isNightNow()); }

/* תפוגת הערת ההורים.

function noteHasExpired(untilStr){

/* ============================================================

   ============================================================ */
const GEM=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],
           [60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],
           [9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];

function gematriya(n){
  let out='';
  let rest=n;
  while(rest>0){
    // 15 ו-16 נכתבים ט״ו וט״ז ולא בצירוף השם
    if(rest===15){ out+='טו'; break; }
    if(rest===16){ out+='טז'; break; }
    const [val,ltr]=GEM.find(([v])=>v<=rest);
    out+=ltr; rest-=val;
  }
  // גרשיים לפני האות האחרונה, או גרש למילה בת אות אחת
  if(out.length===1) return out+'׳';
  return out.slice(0,-1)+'״'+out.slice(-1);
}

/* שליפת יום/חודש/שנה עבריים מהדפדפן, והמרה לאותיות בעצמנו */
const HEB_PARTS = new Intl.DateTimeFormat('he-u-ca-hebrew-nu-latn',
  {day:'numeric',month:'long',year:'numeric'});

function hebDateString(d){
  const parts=HEB_PARTS.formatToParts(d);
  const get=t=>(parts.find(p=>p.type===t)||{}).value||'';
  const day=parseInt(get('day'),10);
  const month=stripNikud(get('month')).replace(/^ב/,'');   // "באב" → "אב"
  let year=parseInt(get('year').replace(/\D/g,''),10);
  if(year>1000) year=year%1000;                             // 5786 → 786
  return `${gematriya(day)} ${month} ${gematriya(year)}`;
}

/* ============================================================
   חולצה לבנה — שלושה מקורות, לפי סדר עדיפות:
   1. תאריך בודד שהוזן ידנית
   2. כלל יום קבוע בשבוע
   3. כלל ראש חודש
   ============================================================ */
function whiteShirtReason(date,singles,rules){
  // 1. תאריך בודד — הכי ספציפי, גובר על הכל
  const one=singles.find(s=>s.date===isoDate(date));
  if(one) return one.reason;

  const active=rules.filter(r=>r.active!==false);

  // 2. יום קבוע בשבוע
  const wd=active.find(r=>r.rule_type==='weekday' && r.weekday===date.getDay());
  if(wd) return wd.reason;

  // 3. ראש חודש
  const rc=active.find(r=>r.rule_type==='rosh_chodesh');
  if(rc && isRoshChodesh(date)) return rc.reason;

  return null;
}

/* ---- ראש חודש: יום 1 או 30 בחודש העברי ---- */
const HEB_DAY = new Intl.DateTimeFormat('en-u-ca-hebrew-nu-latn',{day:'numeric'});
function isRoshChodesh(d){
  const n=parseInt(HEB_DAY.format(d),10);
  return n===1||n===30;
}

/* ============================================================
   כל לוגיקת היום נשענת על שעון ישראל במפורש, לא על שעון המכשיר.
   הקיוסק רץ על TV Stick — אם המכשיר יאותחל לאזור זמן שגוי,
   מעבר ה-12:00, מצב הלילה והתמונה היומית עדיין יהיו נכונים.
   ============================================================ */
/* תאריך ISO מתוך אובייקט Date שכבר מייצג שעון ישראל */
function isoOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
    +`-${String(d.getDate()).padStart(2,'0')}`;
}

function israelNow(){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jerusalem',
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(nowDate());
  const g=t=>+p.find(x=>x.type===t).value;
  return new Date(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'),g('second'));
}

function displayDate(){
  const now=israelNow(), d=new Date(now);
  const isTomorrow=now.getHours()>=CONFIG.SWITCH_HOUR;
  if(isTomorrow) d.setDate(d.getDate()+1);
  return {date:d,isTomorrow};
}

/* ============================================================
   כותרת המערכת — "מערכת היום" / "מערכת למחר" / "מערכת לחזרה ללימודים".
   "מחר" מופיע רק כשיום הלימודים המוצג הוא באמת מחר.
   ============================================================ */
function daysBetween(a,b){
  const x=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const y=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((y-x)/86400000);
}
/* יום הלימודים הבא: מדלג על ימים בלי מערכת (שבת, ולפי הנתונים גם שישי)
   ועל תאריכים שסומנו כחופש לכל הילדים ב-schedule_overrides. */
function nextSchoolDate(start,scheduleRows,overrides){
  for(let i=0;i<21;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const iso=isoDate(d);
    const letter=DAYS[d.getDay()];
    const hasLessons=scheduleRows.some(r=>r.day===letter && r.subject && r.subject.trim());
    /* יום שיש עליו הערה מכסה הוא יעד תקין — ההערה היא מה שצריך להופיע.
       הגרסה הקודמת דילגה עליו, ולכן הערות מכסות לכל הילדים לא הופיעו לעולם. */
    const covered=(overrides||[]).some(o=>!o.kid && o.date===iso);
    if(covered) return d;
    /* חופשה מלוח משרד החינוך — מדלגים, גם אם יש מערכת ליום הזה בשבוע */
    if(isVacationDate(iso)) continue;
    if(hasLessons) return d;
  }
  return start;
}

function scheduleLabel(date,isTomorrow){
  const gap=daysBetween(israelNow(),date);
  if(gap<=0) return 'מערכת היום';
  if(gap===1) return 'מערכת למחר';
  return 'מערכת לחזרה ללימודים';
}
/* שורת הסבר קטנה על הימים המדולגים — מופיעה רק כשלא מדובר במחר.
   כשהדילוג נובע מחופשה בלוח משרד החינוך, מציינים את שם החופשה
   במקום לפרט את כל שמות הימים. */
function skippedDaysNote(date){
  const gap=daysBetween(israelNow(),date);
  if(gap<=1) return '';
  const vacNames=[];
  for(let i=0;i<gap;i++){
    const d=israelNow(); d.setDate(d.getDate()+i);
    const iso=isoDate(d);
    if(i===0 && israelNow().getHours()<CONFIG.SWITCH_HOUR) continue;
    calRowsCovering(iso).filter(r=>r.kind==='vacation').forEach(r=>{
      if(r.event && !vacNames.includes(r.event)) vacNames.push(r.event);
    });
  }
  if(vacNames.length){
    return 'חופשת '+vacNames.join(' ו')+' — אין לימודים';
  }
  const names=[];
  for(let i=0;i<gap;i++){
    const d=israelNow(); d.setDate(d.getDate()+i);
    if(i===0 && israelNow().getHours()<CONFIG.SWITCH_HOUR) continue;
    names.push(DAY_FULL[DAYS[d.getDay()]]);
  }
  if(!names.length) return '';
  const list = names.length===1 ? names[0]
             : names.slice(0,-1).join(', ')+' ו'+names[names.length-1];
  return list+' — אין לימודים';
}
const gregString=d=>d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});
const isoDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
