<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח המשפחה</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="לוח המשפחה">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ============================================================
   קובץ הגדרות מרכזי
   --k = מקדם קנה מידה. נקבע אוטומטית כדי שהדף תמיד ייכנס במסך.
   כל הגדלים ברם (rem) = יחידת גובה מסך × המקדם.
   ============================================================ */
:root{
  --k:1;
  --bg:#FBF8F3; --bg-warm:#FAF0E4;
  --ink:#2A2A2E; --ink-soft:#6E6E76; --ink-faint:#A8A8B0;
  --line:#E2DDD3; --card:#FFFFFF;

  --kid1:#1F6F8B; --kid1-bg:#E8F1F5;   /* איתמר — כחול ים */
  --kid2:#6B4E9B; --kid2-bg:#F0EBF7;   /* עדי — סגול */
  --kid3:#C2467E; --kid3-bg:#FBEBF3;   /* ענבר — ורוד */

  --alert:#B36B00; --alert-bg:#FDF3E0;
  --break-bg:#F2F0EC;

  --font-display:Arial,Helvetica,sans-serif;
  --font-body:Arial,Helvetica,sans-serif;
}
html{font-size:calc(1vh * var(--k))}
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);-webkit-user-select:none;user-select:none}
body.kiosk *{pointer-events:none!important}
body.kiosk{cursor:none}

#app{min-height:100vh;display:flex;flex-direction:column;padding:1.8rem 2vw;gap:1.2rem}

/* א. תאריך */
.datebar{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:.8rem;border-bottom:2px solid var(--line);flex-shrink:0}
.dayname{font-family:var(--font-display);font-size:4.2rem;font-weight:900;line-height:1.15}
.datecol{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.hebdate{font-family:var(--font-display);font-size:3.8rem;font-weight:700}
.gregdate{font-size:2rem;color:var(--ink-soft);margin-top:.2rem}
.clock{font-size:4.2rem;font-weight:900;font-family:var(--font-display);
  color:var(--ink-soft);direction:ltr;letter-spacing:-.02em}

/* ב. מזג אוויר + חולצה */
.toprow{display:flex;gap:1vw;flex-shrink:0}
.weather{display:flex;gap:.9vw;flex:1}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;
  padding:1.1rem 1.2vw;flex:1;display:flex;flex-direction:column;justify-content:center;gap:.3rem}
.wlabel{font-size:1.8rem;font-weight:700;color:var(--ink-soft)}
.wmain{display:flex;align-items:center;gap:.8vw}
.wicon{font-size:4rem;line-height:1}
.wtemp{font-size:3.6rem;font-weight:700;font-family:var(--font-display)}
.wrange{font-size:1.7rem;color:var(--ink-soft)}
.wtip{font-size:1.9rem;font-weight:500;color:var(--alert);margin-top:.2rem}

.shirtbox{background:var(--alert-bg);border:.55rem solid var(--alert);border-radius:1.4rem;
  padding:1rem 1.8vw;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:.3rem;box-shadow:0 0 0 .25rem #fff, 0 0 0 .75rem var(--alert), 0 .4rem 1.6rem rgba(179,107,0,.35)}
.shirtbox.on{display:flex}
.shirtbox svg{height:9.5rem;width:auto;filter:drop-shadow(0 .15rem .4rem rgba(0,0,0,.18))}
.shirtcap{font-size:2rem;font-weight:900;color:var(--alert);white-space:nowrap;letter-spacing:-.01em}
.shirtreason{font-size:1.6rem;font-weight:700;color:var(--alert);opacity:.85;white-space:nowrap}

/* ג+ד. הערות */
.notes{flex-shrink:0;display:flex;flex-direction:column;gap:.5rem}
.note{font-size:2.1rem;font-weight:500;padding:.7rem 1.2vw;background:var(--card);
  border:1px solid var(--line);border-inline-start:5px solid var(--ink-soft);border-radius:1.1rem}
.note.hidden{display:none}
.note.bold{border-inline-start-color:var(--alert);background:var(--alert-bg);
  color:var(--alert);font-weight:900;font-size:2.6rem}
.note-shirt{border-inline-start-color:var(--alert);background:var(--alert-bg);
  color:var(--alert);font-weight:700}

/* ה. מערכת שעות */
.schedwrap{flex-shrink:0;display:flex;flex-direction:column;gap:.6rem}
.schedtitle{font-family:var(--font-display);font-size:3rem;font-weight:900;line-height:1.2}
.schedtitle .sub{font-family:var(--font-body);font-size:1.9rem;font-weight:400;
  color:var(--ink-soft);margin-inline-start:.7vw}
table.sched{width:100%;border-collapse:collapse;table-layout:fixed}
table.sched th,table.sched td{border:1px solid var(--line);text-align:center;
  vertical-align:middle;padding:.75rem .3vw;
  overflow-wrap:anywhere;word-break:break-word;hyphens:auto}
table.sched th.kid,table.sched td.kid{border-inline-width:3px}
th.kid{font-size:2.6rem;font-weight:900;padding:.8rem 0;color:#fff}
th.kid .grade{font-size:1.5rem;font-weight:400;opacity:.85;margin-inline-start:.4rem}
th.pcol{width:8vw;background:var(--card)}
td.pnum{background:var(--card);line-height:1.05}
.pn{font-size:2.7rem;font-weight:700;font-family:var(--font-display);display:block}
.pt{font-size:1.5rem;font-weight:400;color:var(--ink-faint);display:block}
td.subj{font-size:2.5rem;font-weight:500}
td.done{background:#F6F5F2;color:#C9C7C2;font-size:1.8rem}
tr.foodrow td{border-top:3px solid var(--line);padding:.55rem .3vw;
  font-size:1.9rem;font-weight:500}
tr.foodrow td.pnum{background:var(--card);font-size:1.5rem;
  font-weight:700;color:var(--ink-soft)}
tr.foodrow td .fx{font-size:1.5rem;color:var(--ink-soft);display:block}
td.ovcell{font-size:3.4rem;font-weight:900;font-family:var(--font-display);
  color:var(--ink);letter-spacing:-.01em}
tr.brk td{background:var(--break-bg);color:var(--ink-soft);padding:.3rem .3vw}
tr.brk td.pnum .pn{font-size:1.8rem;font-weight:500;font-family:var(--font-body)}
tr.brk td.pnum .pt{font-size:1.3rem}

/* ו. חוגים */
.chugim{flex-shrink:0;background:var(--card);border:1px solid var(--line);
  border-radius:1.1rem;padding:.8rem 1.2vw}
.chugim.hidden{display:none}
.chtitle{font-size:1.9rem;font-weight:700;margin-bottom:.5rem;color:var(--ink-soft)}
/* לוח חוגים שבועי — עמודה לכל יום */
table.chweek{width:100%;border-collapse:collapse;table-layout:fixed}
table.chweek th{font-size:1.6rem;font-weight:900;color:var(--ink-soft);
  padding:.35rem .3vw;text-align:center;border-bottom:2px solid var(--line)}
table.chweek td{padding:.4rem .3vw;vertical-align:top;text-align:center}
/* קווי הפרדה בין הימים */
table.chweek th+th,table.chweek td+td{border-inline-start:2px solid var(--line)}
/* היום הנוכחי — מחצות עד חצות */
table.chweek th.chnow{background:var(--ink);color:#fff;border-radius:.6rem .6rem 0 0}
table.chweek td.chnow{background:#F2EFE9}
.chent{font-size:1.65rem;line-height:1.25;margin-bottom:.4rem}
.chent .t{font-weight:900;direction:ltr;display:inline-block;margin-inline-end:.3rem}
.chent .k{font-weight:900}
.chent .a{color:var(--ink-soft)}
.chent .loc{color:var(--ink-faint);font-size:.9em;margin-inline-start:.2em}
.chempty{font-size:1.4rem;color:#C9C7C2}

/* ז. תמונות */
.photos{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);gap:.7vw;height:13rem}
.photos.hidden{display:none}
.photos img{width:100%;height:100%;object-fit:cover;border-radius:1.1rem}

/* שבת וחג */
body.shabbat{background:var(--bg-warm)}
#holiday{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2rem}
#holiday.on{display:flex}
.greet{font-family:var(--font-display);font-size:10rem;font-weight:900}
.holicon{font-size:14rem;line-height:1}

#err{position:fixed;bottom:0;inset-inline:0;background:#8B2020;color:#fff;
  font-size:1.8rem;padding:.8rem 2vw;display:none;z-index:50;text-align:center}
#err.on{display:block}

/* כפתור מעבר לבקרה — מופיע רק בטלפון, לעולם לא על הצג בבית */
#gotoControl{display:none;position:fixed;bottom:16px;inset-inline-end:16px;
  background:var(--ink);color:#fff;border:none;border-radius:30px;
  padding:13px 22px;font-size:15px;font-weight:700;font-family:var(--font-body);
  box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:60;cursor:pointer;
  text-decoration:none}

/* טלפון / מסך צר */
@media (max-aspect-ratio:1/1){
  html{font-size:1vh}
  body{overflow:auto;height:auto}
  body.kiosk{cursor:auto}
  body.kiosk #gotoControl{pointer-events:auto!important}
  #app{padding:14px 4vw;gap:12px;min-height:auto;padding-bottom:80px}

  .datebar{flex-direction:column;align-items:flex-start;gap:4px}
  .dayname{font-size:26px}
  .hebdate{font-size:22px}
  .gregdate{font-size:14px}

  .toprow{flex-direction:column;gap:10px}
  .wcard{padding:12px 14px}
  .wlabel{font-size:13px}.wicon{font-size:30px}.wtemp{font-size:28px}
  .wrange{font-size:13px}.wtip{font-size:14px}
  .shirtbox{padding:14px;border-width:5px;box-shadow:0 0 0 3px #fff,0 0 0 7px var(--alert)}
  .shirtbox svg{height:70px}
  .shirtcap{font-size:18px}.shirtreason{font-size:15px}

  .note{font-size:15px;padding:10px 12px}
  .schedtitle{font-size:20px}.schedtitle .sub{font-size:14px}

  th.pcol{width:52px}
  th.kid{font-size:15px;padding:8px 2px}
  .pn{font-size:17px}.pt{font-size:11px}
  td.subj{font-size:14px;padding:9px 2px}
  td.done{font-size:11px}
  tr.brk td{padding:4px 2px}
  tr.brk td.pnum .pn{font-size:12px}

  .chtitle{font-size:15px}
  table.chtab th{font-size:12px}
  table.chtab td{font-size:14px;padding:7px 3px}

  .photos{grid-template-columns:repeat(2,1fr);height:auto}
  .photos img{aspect-ratio:4/3;height:auto}

  .greet{font-size:40px}.holicon{font-size:60px}
  #gotoControl{display:block}
}
</style>
</head>
<body class="kiosk">

<script type="module">
/* ============================================================
   הגדרות — לשינוי כאן בלבד
   ============================================================ */
const CONFIG = {
  SUPABASE_URL:'https://ghnvkgufqtbwfmsaassx.supabase.co',
  SUPABASE_KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdobnZrZ3VmcXRid2Ztc2Fhc3N4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDgzODEsImV4cCI6MjEwMTUyNDM4MX0.483IfREbtaqxKi1SQUE2Xw2Eh6xlPwDZDvUcDXzZXz0',
  LAT:32.1056, LON:35.1739, TIMEZONE:'Asia/Jerusalem',
  SWITCH_HOUR:12, SHABBAT_HOUR:19, REFRESH_MIN:5, PHOTO_COUNT:4,
  BUCKET:'photos',
};

let KIDS=[];   // נטען מטבלת kids
const CLOCK_FMT=new Intl.DateTimeFormat('he-IL',
  {timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit',hour12:false});
function tickClock(){ const e=$('clock'); if(e) e.textContent=CLOCK_FMT.format(new Date()); }

const DAYS=['א','ב','ג','ד','ה','ו','ש'];
const DAY_FULL={'א':'ראשון','ב':'שני','ג':'שלישי','ד':'רביעי','ה':'חמישי','ו':'שישי','ש':'שבת'};
const $=id=>document.getElementById(id);
function showErr(m){const e=$('err');e.textContent=m;e.classList.add('on');}

/* ---- הסרת ניקוד וטעמים (משאיר גרש/גרשיים) ---- */
const stripNikud = s => s.replace(/[\u0591-\u05BD\u05BF-\u05C7]/g,'');

/* ============================================================
   המרה לגימטריה — אותיות בלבד, בלי ספרות
   ============================================================ */
const GEM=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],
           [60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],
           [9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];

function gematriya(n){
  let out='';
  let rest=n;
  while(rest>0){
    // 15 ו-16 נכתבים ט״ו וט״ז ולא בצירוף השם
    if(rest===15){ out+='טו'; break; }
    if(rest===16){ out+='טז'; break; }
    const [val,ltr]=GEM.find(([v])=>v<=rest);
    out+=ltr; rest-=val;
  }
  // גרשיים לפני האות האחרונה, או גרש למילה בת אות אחת
  if(out.length===1) return out+'׳';
  return out.slice(0,-1)+'״'+out.slice(-1);
}

/* שליפת יום/חודש/שנה עבריים מהדפדפן, והמרה לאותיות בעצמנו */
const HEB_PARTS = new Intl.DateTimeFormat('he-u-ca-hebrew-nu-latn',
  {day:'numeric',month:'long',year:'numeric'});

function hebDateString(d){
  const parts=HEB_PARTS.formatToParts(d);
  const get=t=>(parts.find(p=>p.type===t)||{}).value||'';
  const day=parseInt(get('day'),10);
  const month=stripNikud(get('month')).replace(/^ב/,'');   // "באב" → "אב"
  let year=parseInt(get('year').replace(/\D/g,''),10);
  if(year>1000) year=year%1000;                             // 5786 → 786
  return `${gematriya(day)} ${month} ${gematriya(year)}`;
}

/* ============================================================
   חולצה לבנה — שלושה מקורות, לפי סדר עדיפות:
   1. תאריך בודד שהוזן ידנית
   2. כלל יום קבוע בשבוע
   3. כלל ראש חודש
   ============================================================ */
function whiteShirtReason(date,singles,rules){
  // 1. תאריך בודד — הכי ספציפי, גובר על הכל
  const one=singles.find(s=>s.date===isoDate(date));
  if(one) return one.reason;

  const active=rules.filter(r=>r.active!==false);

  // 2. יום קבוע בשבוע
  const wd=active.find(r=>r.rule_type==='weekday' && r.weekday===date.getDay());
  if(wd) return wd.reason;

  // 3. ראש חודש
  const rc=active.find(r=>r.rule_type==='rosh_chodesh');
  if(rc && isRoshChodesh(date)) return rc.reason;

  return null;
}

/* ---- ראש חודש: יום 1 או 30 בחודש העברי ---- */
const HEB_DAY = new Intl.DateTimeFormat('en-u-ca-hebrew-nu-latn',{day:'numeric'});
function isRoshChodesh(d){
  const n=parseInt(HEB_DAY.format(d),10);
  return n===1||n===30;
}

function displayDate(){
  const now=new Date(), d=new Date(now);
  const isTomorrow=now.getHours()>=CONFIG.SWITCH_HOUR;
  if(isTomorrow) d.setDate(d.getDate()+1);
  return {date:d,isTomorrow};
}
const gregString=d=>d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});
const isoDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* ---- שבת: 19:00 בערב שבת עד 19:00 במוצאי ---- */
function shabbatInfo(){
  const now=new Date(),h=now.getHours(),dow=now.getDay();
  if(dow===5&&h>=CONFIG.SHABBAT_HOUR) return {greet:'שבת שלום',icon:'🕯️'};
  if(dow===6&&h< CONFIG.SHABBAT_HOUR) return {greet:'שבת שלום',icon:'🕯️'};
  return null;
}

/* ---- חגים: ספרייה אופציונלית, לא חוסמת ---- */
let hebcal=null;
async function loadHebcal(){
  try{ hebcal=await import('https://esm.sh/@hebcal/core@5'); }
  catch(e){ console.warn('hebcal unavailable — Shabbat only'); }
}
function chagInfo(){
  if(!hebcal) return null;
  try{
    const {HDate,HebrewCalendar,flags}=hebcal;
    const now=new Date();
    const test=d=>{
      const hd=new HDate(d);
      for(const e of HebrewCalendar.calendar({start:hd,end:hd,il:true})){
        if(e.getFlags()&flags.CHAG){
          const n=stripNikud(e.render('he'));
          return {greet:greetFor(n),icon:iconFor(n)};
        }
      }
      return null;
    };
    const t=test(now);
    if(t&&now.getHours()<CONFIG.SHABBAT_HOUR) return t;
    if(now.getHours()>=CONFIG.SHABBAT_HOUR){
      const tm=new Date(now); tm.setDate(tm.getDate()+1);
      return test(tm);
    }
  }catch(e){ console.warn('chag check failed'); }
  return null;
}
function greetFor(n){
  if(n.includes('פסח'))return'חג פסח שמח';
  if(n.includes('סוכות'))return'חג סוכות שמח';
  if(n.includes('שבועות'))return'חג שבועות שמח';
  if(n.includes('ראש השנה'))return'שנה טובה';
  if(n.includes('כיפור'))return'גמר חתימה טובה';
  return'חג שמח';
}
function iconFor(n){
  if(n.includes('פסח'))return'🍷';
  if(n.includes('סוכות'))return'🌿';
  if(n.includes('ראש השנה'))return'🍎';
  if(n.includes('כיפור'))return'🕊️';
  return'🕯️';
}

/* ---- מזג אוויר ---- */
const WCODE={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',
 61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',80:'🌧️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
function clothingTip(max,code){
  if([51,53,55,61,63,65,80,81,82,95,96,99].includes(code))return'קחו מעיל, צפוי גשם';
  if(max>=30)return'חם מאוד — קצרים וכובע';
  if(max>=25)return'נעים — קצרים';
  if(max>=18)return'מומלץ סווטשירט';
  if(max>=12)return'קריר — סוודר';
  return'קר — מעיל חם';
}
async function loadWeather(){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LAT}&longitude=${CONFIG.LON}`
      +`&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=${encodeURIComponent(CONFIG.TIMEZONE)}&forecast_days=2`;
    const j=await (await fetch(url)).json(), d=j.daily;
    for(let i=0;i<2;i++){
      $('wicon'+i).textContent=WCODE[d.weather_code[i]]||'🌡️';
      $('wtemp'+i).textContent=Math.round(d.temperature_2m_max[i])+'°';
      $('wrange'+i).textContent=`מקסימום ${Math.round(d.temperature_2m_max[i])}° · מינימום ${Math.round(d.temperature_2m_min[i])}°`;
    }
    $('wtip').textContent=clothingTip(d.temperature_2m_max[1],d.weather_code[1]);
  }catch(e){ console.warn('weather failed'); }
}

/* ---- מערכת שעות ---- */
function buildSchedule(periods,rows,overrides,meals){
  const body=$('schedbody'); body.innerHTML='';
  overrides = overrides || [];
  const allOv = overrides.find(o=>!o.kid);          // כיסוי לכל הילדים
  const kidOv = {};                                  // כיסוי לילד ספציפי
  overrides.forEach(o=>{ if(o.kid) kidOv[o.kid]=o; });

  const map={}; KIDS.forEach(k=>map[k.name]={});
  rows.forEach(r=>{ if(map[r.kid]) map[r.kid][r.period]=r.subject; });

  let last=0;
  rows.forEach(r=>{ if(r.subject&&r.subject.trim()) last=Math.max(last,r.period); });

  const head=document.createElement('tr');
  head.innerHTML='<th class="pcol"></th>'+KIDS.map(k=>
    `<th class="kid" style="background:${k.color}">${k.name}${
      k.grade?`<span class="grade">(${k.grade})</span>`:''}</th>`).join('');
  body.appendChild(head);

  // כיסוי לכולם — שורה אחת גדולה במקום כל המערכת
  if(allOv){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="ovcell" colspan="${KIDS.length+1}">${allOv.note||'חופש'}</td>`;
    body.appendChild(tr);
    return;
  }

  const ordered=[...periods].sort((a,b)=>a.order_index-b.order_index)
    .filter(p=>{ const b=p.label.trim()==='הפסקה';
                 return b || parseInt(p.label,10)<=last; });
  const rowCount=ordered.length;
  const ovDone={};

  ordered.forEach(p=>{
    const isBreak=p.label.trim()==='הפסקה';
    const num=isBreak?null:parseInt(p.label,10);
    const tr=document.createElement('tr');
    if(isBreak) tr.className='brk';
    const time=p.start_time?p.start_time.slice(0,5):'';
    let html=`<td class="pnum"><span class="pn">${isBreak?'הפסקה':num}</span><span class="pt">${time}</span></td>`;
    KIDS.forEach((k,ki)=>{
      const ov=kidOv[k.name];
      if(ov){
        // תא כיסוי אחד לכל העמודה — נוצר רק בשורה הראשונה
        if(!ovDone[k.name]){
          ovDone[k.name]=true;
          html+=`<td class="kid ovcell" rowspan="${rowCount}"
                     style="background:${k.bg}">${ov.note||'חופש'}</td>`;
        }
        return;
      }
      if(isBreak){ html+=`<td class="kid" style="background:var(--break-bg)"></td>`; }
      else{
        const s=map[k.name][num];
        html+=(s&&s.trim())
          ? `<td class="kid subj" style="background:${k.bg}">${s}</td>`
          : `<td class="kid done">סיים</td>`;
      }
    });
    tr.innerHTML=html;
    body.appendChild(tr);
  });

  // שורת אוכל — רק לילדים שהתצוגה דלוקה אצלם
  meals = meals || {};
  const anyFood=KIDS.some(k=>k.show_food!==false && meals[k.name]);
  if(anyFood){
    const tr=document.createElement('tr');
    tr.className='foodrow';
    let html='<td class="pnum">אוכל</td>';
    KIDS.forEach(k=>{
      const m=(k.show_food!==false)?meals[k.name]:null;
      html += m
        ? `<td class="kid" style="background:${k.bg}">${m.text}${
            m.note?`<span class="fx">${m.note}</span>`:''}</td>`
        : `<td class="kid"></td>`;
    });
    tr.innerHTML=html;
    body.appendChild(tr);
  }
}

let ALL_KIDS=[];
/* אוכל ליום המוצג: רשומה לתאריך גוברת על תבנית שבועית קבועה */
function mealsForDay(all,date,dayLetter){
  const iso=isoDate(date), out={};
  const approved=all.filter(m=>m.status!=='pending'&&m.status!=='rejected');
  const label=m=>(m.food_types&&m.food_types.name)||m.custom_text||'';

  approved.filter(m=>m.is_recurring&&m.weekday===dayLetter)
    .forEach(m=>{ const t=label(m); if(t) out[m.kid]={text:t,note:m.note}; });
  approved.filter(m=>m.date===iso)
    .forEach(m=>{ const t=label(m); if(t) out[m.kid]={text:t,note:m.note}; });
  return out;
}

function buildChugim(list){
  const box=$('chugim'),out=$('chlist');
  if(!list.length){box.classList.add('hidden');return;}
  // היום הנוכחי כאן נמדד מחצות עד חצות — בשונה מכלל ה-12:00
  const nowDay=DAYS[new Date().getDay()];
  const WEEK=['א','ב','ג','ד','ה','ו'];

  const head='<tr>'+WEEK.map(d=>
    `<th class="${d===nowDay?'chnow':''}">${DAY_FULL[d]}</th>`).join('')+'</tr>';

  const body='<tr>'+WEEK.map(d=>{
    const items=list.filter(c=>c.day===d)
      .sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    if(!items.length) return `<td class="${d===nowDay?'chnow':''}"><span class="chempty">—</span></td>`;
    const inner=items.map(c=>{
      const k=ALL_KIDS.find(x=>x.name===c.kid);
      const col=k?k.color:'var(--ink-soft)';
      return `<div class="chent">
        ${c.time?`<span class="t">${c.time.slice(0,5)}</span>`:''}
        <span class="k" style="color:${col}">${c.kid}</span>
        <span class="a"> ${c.activity}</span>
        ${c.location?`<span class="loc">· ${c.location}</span>`:''}
      </div>`;
    }).join('');
    return `<td class="${d===nowDay?'chnow':''}">${inner}</td>`;
  }).join('')+'</tr>';

  out.innerHTML=head+body;
  box.classList.remove('hidden');
}

let PHOTO_URLS=[];
let photoDay='';

/* שליפת רשימת התמונות מהאחסון */
async function loadPhotoList(){
  if(!db) return;
  try{
    const {data,error}=await db.storage.from(CONFIG.BUCKET)
      .list('',{limit:200});
    if(error) throw error;
    PHOTO_URLS=(data||[])
      .filter(f=>f.name && !f.name.startsWith('.'))
      .map(f=>db.storage.from(CONFIG.BUCKET).getPublicUrl(f.name).data.publicUrl);
  }catch(e){ console.warn('photos unavailable',e); PHOTO_URLS=[]; }
}

/* בחירה אקראית יציבה ליום — מתחלפת בחצות */
function buildPhotos(){
  const box=$('photos');
  if(!PHOTO_URLS.length){box.classList.add('hidden');return;}

  const today=new Date().toDateString();
  photoDay=today;
  let h=0; for(const ch of today) h=(h*31+ch.charCodeAt(0))>>>0;

  const pool=[...PHOTO_URLS],pick=[];
  while(pick.length<Math.min(CONFIG.PHOTO_COUNT,pool.length)){
    h=(h*1103515245+12345)>>>0;
    pick.push(pool.splice(h%pool.length,1)[0]);
  }
  box.style.gridTemplateColumns=`repeat(${pick.length},1fr)`;
  box.innerHTML=pick.map(u=>`<img src="${u}" alt="">`).join('');
  box.classList.remove('hidden');
  box.querySelectorAll('img').forEach(im=>{
    im.onload=fitToScreen; im.onerror=()=>{ im.remove(); fitToScreen(); };
  });
}

/* ============================================================
   התאמה אוטומטית למסך — מבטיח שכלום לא נחתך
   ============================================================ */
function fitToScreen(){
  if(window.innerWidth <= window.innerHeight) return;   // בטלפון מותרת גלילה

  const root=document.documentElement, app=$('app');

  // בדיקה: האם משהו חורג — בגובה, ברוחב, או תא שנחתך
  const overflows=()=>{
    if(app.scrollHeight > window.innerHeight+1) return true;
    if(app.scrollWidth  > window.innerWidth +1) return true;
    for(const el of app.querySelectorAll('td,th,.note,.chent,.wtip,.shirtcap,.shirtreason')){
      if(el.scrollHeight > el.clientHeight+2) return true;   // טקסט נחתך לגובה
      if(el.scrollWidth  > el.clientWidth +2) return true;   // טקסט נחתך לרוחב
    }
    return false;
  };

  // חיפוש בינארי על מקדם קנה המידה — מדויק ומהיר
  let lo=0.30, hi=1.80, best=lo;
  for(let i=0;i<18;i++){
    const mid=(lo+hi)/2;
    root.style.setProperty('--k',mid.toFixed(4));
    app.offsetHeight;                    // מאלץ חישוב מחדש
    if(overflows()){ hi=mid; } else { best=mid; lo=mid; }
  }
  root.style.setProperty('--k',best.toFixed(4));
}

/* מריצים שוב אחרי טעינת גופנים ותמונות — הם משנים מידות */
function scheduleFit(){
  requestAnimationFrame(()=>requestAnimationFrame(fitToScreen));
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitToScreen);
  setTimeout(fitToScreen,400);
  setTimeout(fitToScreen,1500);
}

/* ============================================================
   ראשי
   ============================================================ */
let db=null;
async function init(){
  await loadHebcal();
  try{
    const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
    db=createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
  }catch(e){ showErr('לא ניתן להתחבר למסד הנתונים'); console.error(e); }
  await loadPhotoList();
  await loadWeather();
  await render();
  setInterval(async()=>{
    // רשימת התמונות נטענת מחדש רק כשמתחלף היום
    if(photoDay && photoDay!==new Date().toDateString()) await loadPhotoList();
    await loadWeather(); await render();
  },CONFIG.REFRESH_MIN*60*1000);
  tickClock(); setInterval(tickClock,10000);
  window.addEventListener('resize',fitToScreen);
}

async function render(){
  const {date,isTomorrow}=displayDate();
  const dayLetter=DAYS[date.getDay()];

  $('dayname').textContent=(isTomorrow?'מחר · יום ':'היום · יום ')+DAY_FULL[dayLetter];
  $('hebdate').textContent=hebDateString(date);
  $('gregdate').textContent=gregString(date);

  const hol=shabbatInfo()||chagInfo();
  if(hol){
    document.body.classList.add('shabbat');
    $('holiday').classList.add('on');
    $('greet').textContent=hol.greet;
    $('holicon').textContent=hol.icon;
    $('schedwrap').style.display='none';
    $('chugim').classList.add('hidden');
    $('shirtbox').classList.remove('on');
  }else{
    document.body.classList.remove('shabbat');
    $('holiday').classList.remove('on');
    $('schedwrap').style.display='';
  }

  if(db){
    try{
      const [kidsRes,periods,sched,chug,shirts,rules,overrides,mealsRes,settings]=await Promise.all([
        db.from('kids').select('*').order('order_index'),
        db.from('periods').select('*'),
        db.from('schedule').select('*').eq('day',dayLetter),
        db.from('chugim').select('*'),
        db.from('white_shirt').select('*'),
        db.from('white_shirt_rules').select('*'),
        db.from('schedule_overrides').select('*'),
        db.from('meals').select('*, food_types(name)'),
        db.from('settings').select('*'),
      ]);

      const allKids=(kidsRes.data||[]);
      KIDS=allKids.filter(k=>k.show_schedule!==false)
                  .map(k=>({name:k.name,color:k.color,bg:k.bg,grade:k.grade,show_food:k.show_food}));
      const chugimKids=allKids.filter(k=>k.show_chugim!==false).map(k=>k.name);
      ALL_KIDS=allKids;

      const note=(settings.data||[]).find(s=>s.key==='parent_note');
      if(note&&note.value&&note.value.trim()){
        $('parentnote').textContent=note.value;
        $('parentnote').classList.remove('hidden');
      }else $('parentnote').classList.add('hidden');

      if(!hol){
        $('schedtitle').innerHTML=(isTomorrow?'מחר':'היום')+
          ` <span class="sub">יום ${DAY_FULL[dayLetter]}</span>`;
        buildSchedule(periods.data||[],sched.data||[],
                      (overrides.data||[]).filter(o=>o.date===isoDate(date)),
                      mealsForDay(mealsRes.data||[],date,dayLetter));
        buildChugim((chug.data||[]).filter(c=>chugimKids.includes(c.kid)));

        const reason=whiteShirtReason(date, shirts.data||[], rules.data||[]);
        if(reason){
          $('shirtbox').classList.add('on');
          $('shirtreason').textContent=reason;
        }else{
          $('shirtbox').classList.remove('on');
        }
      }
      buildPhotos();
    }catch(e){ showErr('שגיאה בטעינת הנתונים'); console.error(e); }
  }

  // אחרי שכל התוכן במקום — מתאימים למסך
  scheduleFit();
}

init();
